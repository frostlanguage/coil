# Lychee - Coil Link Checker Configuration

format = "detailed"
no_progress = true
max_concurrency = 16
max_redirects = 10
max_retries = 3
retry_wait_time = 2
timeout = 20

method = "get"
min_tls = "TLSv1_2"
require_https = true
include_fragments = "anchor-only"
include_mail = false
include_verbatim = false

exclude_all_private = true
exclude_path = [ "(^|/)LICENSES/", "(^|/)node_modules/", "(^|/)(?:build|dist|vendor)/" ]

exclude = [ "^mailto:" ]

# EOF
