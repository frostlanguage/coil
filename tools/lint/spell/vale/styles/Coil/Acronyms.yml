---
extends: conditional
message: "Define '%s' at first use."
level: warning
scope: text
ignorecase: false
first: '\b([A-Z][A-Z0-9]{1,5})s?\b'
second: '(?:\b[A-Z][A-Za-z-]+[ ]?){2,}\(([A-Z][A-Z0-9]{1,5})s?\)'
exceptions:
  - ABI
  - API
  - ASCII
  - CMake
  - CPU
  - CSS
  - DMA
  - ELF
  - FFI
  - GNU
  - GPU
  - HTML
  - HTTP
  - HTTPS
  - IDE
  - IEEE
  - JSON
  - JSONC
  - POSIX
  - RAM
  - README
  - ROM
  - SI
  - SIMD
  - SPDX
  - SQL
  - TLS
  - TOML
  - URI
  - URL
  - UTF
  - XML
  - YAML

# EOF
