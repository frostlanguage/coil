[files]
extend-exclude = [
  ".git/**",
  "LICENSES/**",
  "**/*.svg",
  "**/*.aff",
  "**/*.dic",
  "**/*.lock",
  "**/*.min.*",
]

[default]
locale = "en-us"
check-filename = true
check-file = true
unicode = true

[default.extend-words]
Coil = "Coil"
CoilStr = "CoilStr"
Frama = "Frama"
stdlib = "stdlib"

