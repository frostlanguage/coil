---
base: lua51

globals:
  io.lines:
    args:
      - required: false
        type: string
      - required: false
        type: "..."
  io.stderr.write:
    method: true
    args:
      - required: false
        type: "..."
  utf8.codes:
    args:
      - type: string
    must_use: true
  utf8.len:
    args:
      - type: string
      - required: false
        type: number
      - required: false
        type: number
    must_use: true

# EOF
