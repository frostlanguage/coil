---
name: Configure CI cache plane
description: Detect shared, local, specialized, and egress cache services.

inputs:
  mode:
    description: disabled, optional, or required. Empty uses the runner setting.
    required: false
    default: ""

outputs:
  enabled:
    description: Whether at least one effective cache-plane service is configured.
    value: ${{ steps.configure.outputs.enabled }}
  bazelrc:
    description: Generated Bazel rc file with remote-cache policy.
    value: ${{ steps.configure.outputs.bazelrc }}
  bazel_write:
    description: Whether this GitHub event may upload Bazel cache results.
    value: ${{ steps.configure.outputs.bazel_write }}
  shared_cache_enabled:
    description: Whether an S3-compatible shared object cache is configured.
    value: ${{ steps.configure.outputs.shared_cache_enabled }}
  shared_cache_write:
    description: Whether this GitHub event may populate the shared object cache.
    value: ${{ steps.configure.outputs.shared_cache_write }}
  registry_enabled:
    description: Whether a runner-near OCI registry is configured.
    value: ${{ steps.configure.outputs.registry_enabled }}
  proxy_enabled:
    description: Whether an HTTP or HTTPS egress proxy is configured.
    value: ${{ steps.configure.outputs.proxy_enabled }}

runs:
  using: composite
  steps:
    - name: Detect and configure cache plane
      id: configure
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        mode="${INPUT_MODE:-${COIL_CI_CACHE_PLANE_MODE:-optional}}"

        case "${mode}" in
          disabled|optional|required)
            ;;
          *)
            printf 'Invalid cache-plane mode: %s\n' "${mode}" >&2
            exit 1
            ;;
        esac

        proxy_enabled=false
        registry_enabled=false
        bazel_enabled=false
        local_tool_cache=false
        shared_cache_enabled=false

        if [[ -n "${HTTPS_PROXY:-${https_proxy:-}}" || \
              -n "${HTTP_PROXY:-${http_proxy:-}}" ]]; then
          proxy_enabled=true
        fi

        registry="${COIL_CI_OCI_REGISTRY:-}"
        if [[ -n "${registry}" ]]; then
          if [[ "${registry}" == *://* || "${registry}" == */* ]]; then
            printf '%s\n' \
              'COIL_CI_OCI_REGISTRY must be a registry host[:port].' >&2
            exit 1
          fi
          registry_enabled=true
        fi

        bazel_cache="${COIL_CI_BAZEL_REMOTE_CACHE:-}"
        if [[ -n "${bazel_cache}" ]]; then
          case "${bazel_cache}" in
            http://*|https://*|grpc://*|grpcs://*)
              bazel_enabled=true
              ;;
            *)
              printf '%s\n' \
                'COIL_CI_BAZEL_REMOTE_CACHE must use HTTP(S) or gRPC(S).' >&2
              exit 1
              ;;
          esac
        fi

        if [[ -n "${COIL_CI_TOOL_CACHE_DIR:-}" ]]; then
          if [[ "${COIL_CI_TOOL_CACHE_DIR}" != /* ]]; then
            printf '%s\n' 'COIL_CI_TOOL_CACHE_DIR must be absolute.' >&2
            exit 1
          fi
          local_tool_cache=true
        fi

        s3_bucket="${COIL_CI_S3_CACHE_BUCKET:-}"
        s3_endpoint="${COIL_CI_S3_CACHE_ENDPOINT:-}"
        s3_prefix="${COIL_CI_S3_CACHE_PREFIX:-coil/cache}"

        if [[ -n "${s3_endpoint}" && -z "${s3_bucket}" ]]; then
          printf '%s\n' \
            'COIL_CI_S3_CACHE_ENDPOINT requires COIL_CI_S3_CACHE_BUCKET.' >&2
          exit 1
        fi

        if [[ -n "${s3_bucket}" ]]; then
          if [[ "${s3_bucket}" == */* || \
                "${s3_bucket}" == *://* || \
                "${s3_bucket}" =~ [[:space:]] ]]; then
            printf '%s\n' \
              'COIL_CI_S3_CACHE_BUCKET must contain only a bucket name.' >&2
            exit 1
          fi

          case "${s3_endpoint}" in
            ""|http://*|https://*)
              ;;
            *)
              printf '%s\n' \
                'COIL_CI_S3_CACHE_ENDPOINT must use HTTP or HTTPS.' >&2
              exit 1
              ;;
          esac

          if [[ "${s3_prefix}" == /* || \
                "${s3_prefix}" == *\\* || \
                "${s3_prefix}" == ".." || \
                "${s3_prefix}" == ../* || \
                "${s3_prefix}" == */../* || \
                "${s3_prefix}" == */.. ]]; then
            printf '%s\n' \
              'COIL_CI_S3_CACHE_PREFIX must be a relative object prefix.' >&2
            exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
            printf '%s\n' \
              'The S3-compatible shared cache requires the aws CLI.' >&2
            exit 1
          fi

          shared_cache_enabled=true
        fi

        shared_cache_write=false
        bazel_write=false

        if [[ "${mode}" != disabled ]]; then
          if [[ "${EVENT_NAME}" == merge_group ]]; then
            shared_cache_write=true
            bazel_write=true
          elif [[ "${EVENT_NAME}" == push && \
                  "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            shared_cache_write=true
            bazel_write=true
          elif [[ "${EVENT_NAME}" == workflow_dispatch && \
                  "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            shared_cache_write=true
            bazel_write=true
          fi
        fi

        enabled=false
        if [[ "${mode}" != disabled ]] && \
           [[ "${proxy_enabled}" == true || \
              "${registry_enabled}" == true || \
              "${bazel_enabled}" == true || \
              "${local_tool_cache}" == true || \
              "${shared_cache_enabled}" == true ]]; then
          enabled=true
        fi

        if [[ "${mode}" == required && \
              "${shared_cache_enabled}" != true ]]; then
          printf '%s\n' \
            'Required cache plane is missing the shared S3-compatible cache.' \
            >&2
          exit 1
        fi

        cache_dir="${RUNNER_TEMP}/coil-cache-plane"
        bazelrc="${cache_dir}/bazelrc"
        mkdir --parents "${cache_dir}"

        {
          printf '%s\n' '# Generated by Coil CI. Do not commit.'
          if [[ "${bazel_enabled}" == true && "${mode}" != disabled ]]; then
            printf 'build --remote_cache=%s\n' "${bazel_cache}"
            printf '%s\n' 'build --remote_verify_downloads=true'
            printf '%s\n' 'build --remote_timeout=30s'
            printf 'build --remote_upload_local_results=%s\n' "${bazel_write}"

            if [[ -n "${COIL_CI_BAZEL_REMOTE_INSTANCE:-}" ]]; then
              printf 'build --remote_instance_name=%s\n' \
                "${COIL_CI_BAZEL_REMOTE_INSTANCE}"
            fi
          fi
        } > "${bazelrc}"

        printf 'enabled=%s\n' "${enabled}" >> "${GITHUB_OUTPUT}"
        printf 'bazelrc=%s\n' "${bazelrc}" >> "${GITHUB_OUTPUT}"
        printf 'bazel_write=%s\n' "${bazel_write}" >> "${GITHUB_OUTPUT}"
        printf 'shared_cache_enabled=%s\n' \
          "${shared_cache_enabled}" >> "${GITHUB_OUTPUT}"
        printf 'shared_cache_write=%s\n' \
          "${shared_cache_write}" >> "${GITHUB_OUTPUT}"
        printf 'registry_enabled=%s\n' \
          "${registry_enabled}" >> "${GITHUB_OUTPUT}"
        printf 'proxy_enabled=%s\n' \
          "${proxy_enabled}" >> "${GITHUB_OUTPUT}"

        {
          printf '%s\n' '### Coil CI cache plane'
          printf '\n'
          printf '| Service | State |\n'
          printf '| --- | --- |\n'
          printf '| L0 runner-local tool cache | %s |\n' "${local_tool_cache}"
          if [[ "${shared_cache_enabled}" == true ]]; then
            printf '| L1 shared object cache | enabled (%s) |\n' \
              "$([[ "${shared_cache_write}" == true ]] && echo read-write || echo read-only)"
          else
            printf '%s\n' '| L1 shared object cache | false |'
          fi
          printf '| OCI registry / mirror | %s |\n' "${registry_enabled}"
          if [[ "${bazel_enabled}" == true ]]; then
            printf '| Bazel remote cache | enabled (%s) |\n' \
              "$([[ "${bazel_write}" == true ]] && echo read-write || echo read-only)"
          else
            printf '%s\n' '| Bazel remote cache | false |'
          fi
          printf '| Egress proxy | %s |\n' "${proxy_enabled}"
          printf '\n'
          printf 'Mode: `%s`. Endpoints are intentionally not logged.\n' "${mode}"
        } >> "${GITHUB_STEP_SUMMARY}"
