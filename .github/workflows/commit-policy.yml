---
name: Commit Policy

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LUA_VERSION: "5.5.1"
  LUA_SHA256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"
  LUV_VERSION: "1.52.1-0"
  LUV_SHA256: "3e6eb820a3aee034f85f9cce9bd77b5d42f34d128a1ccec877adf28c913577c7"
  CODESPELL_VERSION: "2.4.1"
  CODESPELL_SHA256: "3dadafa67df7e4a3dbf51e0d7315061b80d265f9552ebd699b3dd6834b47e425"
  LYCHEE_VERSION: "0.24.1"
  LYCHEE_SHA256: "3ecad9a6e5ec42efaa9cdbdbad2406fdeef11ee38f7774aaf038f981d3248684"
  TYPOS_VERSION: "1.46.0"
  TYPOS_SHA256: "c62a626df385c96574743fd4974aeb271a41a67d080a0398e36e1a42782f614a"
  VALE_VERSION: "3.18.0"
  VALE_SHA256: "a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITTUF_VERSION: "0.15.0"
  GITTUF_SHA256: "e60629e4d165bf47ac450fde834af20d7c5ff1f08f15d685980c37b9d522ae1d"
  GIT_REMOTE_GITTUF_SHA256: "7029c8f026b574622087110162dff27a3cb15d73161fdecee9ef65c76e50dedf"

jobs:
  git-hook-mocks:
    name: Git hook mock tests
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate mock test sources
        run: |
          set -euo pipefail

          test -f tests/mock/git_hooks/coil-hook-test-suite.lua
          test -f tests/mock/git_hooks/coil-ref-policy-test-suite.lua

      - name: Restore Lua source archive
        id: lua_download
        uses: ./.github/actions/verified-download
        with:
          name: lua
          version: ${{ env.LUA_VERSION }}
          filename: lua-${{ env.LUA_VERSION }}.tar.gz
          sha256: ${{ env.LUA_SHA256 }}
          origin: https://www.lua.org
          directory: ftp

      - name: Restore luv source archive
        id: luv_download
        uses: ./.github/actions/verified-download
        with:
          name: luv
          version: ${{ env.LUV_VERSION }}
          filename: luv-${{ env.LUV_VERSION }}.tar.gz
          sha256: ${{ env.LUV_SHA256 }}
          origin: https://github.com
          directory: luvit/luv/releases/download/${{ env.LUV_VERSION }}

      - name: Restore codespell wheel
        id: codespell_download
        uses: ./.github/actions/verified-download
        with:
          name: codespell
          version: ${{ env.CODESPELL_VERSION }}
          filename: codespell-${{ env.CODESPELL_VERSION }}-py3-none-any.whl
          sha256: ${{ env.CODESPELL_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/20/01/b394922252051e97aab231d416c86da3d8a6d781eeadcdca1082867de64e

      - name: Restore typos archive
        id: typos_download
        uses: ./.github/actions/verified-download
        with:
          name: typos
          version: ${{ env.TYPOS_VERSION }}
          filename: typos-v${{ env.TYPOS_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          sha256: ${{ env.TYPOS_SHA256 }}
          origin: https://github.com
          directory: crate-ci/typos/releases/download/v${{ env.TYPOS_VERSION }}

      - name: Restore Vale archive
        id: vale_download
        uses: ./.github/actions/verified-download
        with:
          name: vale
          version: ${{ env.VALE_VERSION }}
          filename: vale_${{ env.VALE_VERSION }}_Linux_64-bit.tar.gz
          sha256: ${{ env.VALE_SHA256 }}
          origin: https://github.com
          directory: vale-cli/vale/releases/download/v${{ env.VALE_VERSION }}

      - name: Restore Lychee archive
        id: lychee_download
        uses: ./.github/actions/verified-download
        with:
          name: lychee
          version: ${{ env.LYCHEE_VERSION }}
          filename: lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256: ${{ env.LYCHEE_SHA256 }}
          origin: https://github.com
          directory: lycheeverse/lychee/releases/download/lychee-v${{ env.LYCHEE_VERSION }}

      - name: Restore Gitleaks archive
        id: gitleaks_download
        uses: ./.github/actions/verified-download
        with:
          name: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          filename: gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256 }}
          origin: https://github.com
          directory: gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}

      - name: Restore gittuf binary
        id: gittuf_download
        uses: ./.github/actions/verified-download
        with:
          name: gittuf
          version: ${{ env.GITTUF_VERSION }}
          filename: gittuf_${{ env.GITTUF_VERSION }}_linux_amd64
          sha256: ${{ env.GITTUF_SHA256 }}
          origin: https://github.com
          directory: gittuf/gittuf/releases/download/v${{ env.GITTUF_VERSION }}

      - name: Restore git-remote-gittuf binary
        id: git_remote_gittuf_download
        uses: ./.github/actions/verified-download
        with:
          name: git-remote-gittuf
          version: ${{ env.GITTUF_VERSION }}
          filename: git-remote-gittuf_${{ env.GITTUF_VERSION }}_linux_amd64
          sha256: ${{ env.GIT_REMOTE_GITTUF_SHA256 }}
          origin: https://github.com
          directory: gittuf/gittuf/releases/download/v${{ env.GITTUF_VERSION }}

      - name: Install pinned mock-test toolchain
        env:
          LUA_ARCHIVE: ${{ steps.lua_download.outputs.path }}
          LUV_ARCHIVE: ${{ steps.luv_download.outputs.path }}
          CODESPELL_PACKAGE: ${{ steps.codespell_download.outputs.path }}
          TYPOS_ARCHIVE: ${{ steps.typos_download.outputs.path }}
          VALE_ARCHIVE: ${{ steps.vale_download.outputs.path }}
          LYCHEE_ARCHIVE: ${{ steps.lychee_download.outputs.path }}
          GITLEAKS_ARCHIVE: ${{ steps.gitleaks_download.outputs.path }}
          GITTUF_BINARY: ${{ steps.gittuf_download.outputs.path }}
          GIT_REMOTE_GITTUF_BINARY: ${{ steps.git_remote_gittuf_download.outputs.path }}
        run: |
          set -euo pipefail

          bin_dir="${RUNNER_TEMP}/coil-mock-bin"
          mkdir --parents "${bin_dir}"

          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

          # Lua
          lua_destination="${LUA_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${lua_destination}" \
            --directory="${RUNNER_TEMP}"

          make \
            --directory="${RUNNER_TEMP}/lua-${LUA_VERSION}" \
            --jobs="$(nproc)" \
            all

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/lua" \
            "${bin_dir}/lua"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/luac" \
            "${bin_dir}/luac"

          # luv: the Lua hook mocks use libuv for portable process and filesystem IO.
          luv_destination="${LUV_ARCHIVE}"
          luv_source="${RUNNER_TEMP}/luv-${LUV_VERSION}"
          luv_build="${RUNNER_TEMP}/luv-build"
          lua_modules="${RUNNER_TEMP}/lua-modules"

          mkdir --parents "${luv_source}" "${lua_modules}"

          tar \
            --extract \
            --gzip \
            --strip-components=1 \
            --file="${luv_destination}" \
            --directory="${luv_source}"

          cmake \
            -S "${luv_source}" \
            -B "${luv_build}" \
            -DBUILD_MODULE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=OFF \
            -DWITH_LUA_ENGINE=Lua \
            -DLUA="${bin_dir}/lua" \
            -DLUA_INCDIR="${RUNNER_TEMP}/lua-${LUA_VERSION}/src" \
            -DLUA_LIBDIR="${RUNNER_TEMP}/lua-${LUA_VERSION}/src" \
            -DLUA_LIBFILE=liblua.a \
            -DLIBDIR="${lua_modules}" \
            -DLUADIR="${lua_modules}"

          cmake --build "${luv_build}" --parallel "$(nproc)"
          cmake --install "${luv_build}"

          printf 'LUA_CPATH=%s\n' \
            "${lua_modules}/?.so;;" \
            >> "${GITHUB_ENV}"

          # CSpell integration stub. The dedicated spelling workflow executes
          # the real pinned CSpell action; this suite only verifies hook wiring.
          cat > "${bin_dir}/cspell" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == "--version" ]]; then
            echo "coil-cspell-hook-mock"
            exit 0
          fi

          input="$(cat)"

          if [[ "${input}" == *qxylophoniczz* ]]; then
            exit 1
          fi
          EOF

          chmod 0755 "${bin_dir}/cspell"

          # codespell
          codespell_destination="${CODESPELL_PACKAGE}"

          python3 -m venv "${RUNNER_TEMP}/codespell"

          "${RUNNER_TEMP}/codespell/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            "${codespell_destination}"

          ln \
            --symbolic \
            "${RUNNER_TEMP}/codespell/bin/codespell" \
            "${bin_dir}/codespell"

          # typos
          typos_destination="${TYPOS_ARCHIVE}"

          mkdir --parents "${RUNNER_TEMP}/typos-release"

          tar \
            --extract \
            --gzip \
            --file="${typos_destination}" \
            --directory="${RUNNER_TEMP}/typos-release"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/typos-release/typos" \
            "${bin_dir}/typos"

          # Vale
          vale_destination="${VALE_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${vale_destination}" \
            --directory="${RUNNER_TEMP}" \
            vale

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/vale" \
            "${bin_dir}/vale"

          # Lychee
          lychee_destination="${LYCHEE_ARCHIVE}"

          mkdir --parents "${RUNNER_TEMP}/lychee-release"

          tar \
            --extract \
            --gzip \
            --file="${lychee_destination}" \
            --directory="${RUNNER_TEMP}/lychee-release"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lychee-release/lychee-x86_64-unknown-linux-gnu/lychee" \
            "${bin_dir}/lychee"

          # Gitleaks
          gitleaks_destination="${GITLEAKS_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${gitleaks_destination}" \
            --directory="${bin_dir}" \
            gitleaks

          chmod 0755 "${bin_dir}/gitleaks"

          # gittuf
          install \
            --mode=0755 \
            "${GITTUF_BINARY}" \
            "${bin_dir}/gittuf"

          install \
            --mode=0755 \
            "${GIT_REMOTE_GITTUF_BINARY}" \
            "${bin_dir}/git-remote-gittuf"

      - name: Show mock-test tool versions
        run: |
          set -euo pipefail

          lua -v
          lua -e 'require("luv"); print("luv OK")'
          cspell --version
          codespell --version
          typos --version
          vale --version
          lychee --version
          gitleaks version
          gittuf version

      - name: Run commit hook mock suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          chmod 0755 \
            .githooks/pre-commit \
            .githooks/commit-msg \
            .githooks/pre-push

          luac -p tests/mock/git_hooks/coil-hook-test-suite.lua
          luac -p tests/mock/git_hooks/coil-ref-policy-test-suite.lua
          lua tests/mock/git_hooks/coil-hook-test-suite.lua

      - name: Run Gitflow and ref mock suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          lua tests/mock/git_hooks/coil-ref-policy-test-suite.lua

  structure:
    name: Structure, DCO, and OpenPGP
    needs:
      - git-hook-mocks
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned Lua
        run: |
          set -euo pipefail

          archive="lua-${LUA_VERSION}.tar.gz"
          destination="${RUNNER_TEMP}/${archive}"
          url="https://www.lua.org/ftp/${archive}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            "${url}" \
            --output "${destination}"

          printf '%s  %s\n' \
            "${LUA_SHA256}" \
            "${destination}" \
            | sha256sum --check --strict

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${RUNNER_TEMP}"

          make \
            --directory="${RUNNER_TEMP}/lua-${LUA_VERSION}" \
            --jobs="$(nproc)" \
            all

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/lua" \
            "${RUNNER_TEMP}/lua"

      - name: Select commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=''

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_BASE_SHA}"
              head_sha="${MERGE_HEAD_SHA}"
              ;;
            push)
              if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
                base_sha="${BEFORE_SHA}"
              else
                git fetch --no-tags origin \
                  "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
                base_sha="$(git merge-base "${head_sha}" "origin/${DEFAULT_BRANCH}")"
              fi
              ;;
            workflow_dispatch)
              base_sha="${head_sha}^"
              ;;
            *)
              printf '%s\n' "unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          git rev-list \
            --reverse \
            "${base_sha}..${head_sha}" \
            > "${RUNNER_TEMP}/commit-policy-shas"

          if [[ ! -s "${RUNNER_TEMP}/commit-policy-shas" ]]; then
            printf '%s\n' "${head_sha}" > "${RUNNER_TEMP}/commit-policy-shas"
          fi

      - name: Validate commit messages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          chmod 0755 .githooks/commit-msg

          while IFS= read -r sha; do
            printf 'Validating message: %s\n' "${sha}"
            PATH="${RUNNER_TEMP}:${PATH}" \
              .githooks/commit-msg --commit "${sha}"
          done < "${RUNNER_TEMP}/commit-policy-shas"

      - name: Require GitHub-verified OpenPGP signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          while IFS= read -r sha; do
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}")"

            verification_filter='.commit.verification.verified == true and '
            verification_filter+='(.commit.verification.signature != null) and '
            verification_filter+='(.commit.verification.signature | '
            verification_filter+='startswith("-----BEGIN PGP SIGNATURE-----"))'

            jq --exit-status "${verification_filter}" \
              <<< "${response}" \
              >/dev/null || {
                printf 'Commit %s does not have a GitHub-verified OpenPGP signature.\n' \
                  "${sha}" >&2
                exit 1
              }
          done < "${RUNNER_TEMP}/commit-policy-shas"

  prose:
    name: Commit message spelling and prose
    needs:
      - git-hook-mocks
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=''

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_BASE_SHA}"
              head_sha="${MERGE_HEAD_SHA}"
              ;;
            push)
              if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
                base_sha="${BEFORE_SHA}"
              else
                git fetch --no-tags origin \
                  "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
                base_sha="$(git merge-base "${head_sha}" "origin/${DEFAULT_BRANCH}")"
              fi
              ;;
            workflow_dispatch)
              base_sha="${head_sha}^"
              ;;
          esac

          mkdir --parents .commit-policy/messages
          index=0

          while IFS= read -r sha; do
            index=$((index + 1))
            printf -v filename '.commit-policy/messages/commit-%04d.md' "${index}"
            git show -s --format=%B "${sha}" > "${filename}"
          done < <(git rev-list --reverse "${base_sha}..${head_sha}")

          if ! compgen -G '.commit-policy/messages/*.md' >/dev/null; then
            git show -s --format=%B "${head_sha}" \
              > .commit-policy/messages/commit-0001.md
          fi

      - name: Check commit-message spelling with CSpell
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          check_dot_files: true
          config: tools/lint/spell/cspell/cspell.jsonc
          files: .commit-policy/messages/**/*.md
          incremental_files_only: false
          root: .
          strict: true
          summary: true
          use_cspell_files: false

      - name: Restore codespell wheel
        id: prose_codespell_download
        uses: ./.github/actions/verified-download
        with:
          name: codespell
          version: ${{ env.CODESPELL_VERSION }}
          filename: codespell-${{ env.CODESPELL_VERSION }}-py3-none-any.whl
          sha256: ${{ env.CODESPELL_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/20/01/b394922252051e97aab231d416c86da3d8a6d781eeadcdca1082867de64e

      - name: Install codespell
        env:
          CODESPELL_PACKAGE: ${{ steps.prose_codespell_download.outputs.path }}
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/codespell"
          "${RUNNER_TEMP}/codespell/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --no-index \
            "${CODESPELL_PACKAGE}"

      - name: Check commit-message spelling with codespell
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/codespell/bin/codespell" \
            --config tools/lint/spell/codespell/.codespellrc \
            .commit-policy/messages

      - name: Restore typos archive
        id: prose_typos_download
        uses: ./.github/actions/verified-download
        with:
          name: typos
          version: ${{ env.TYPOS_VERSION }}
          filename: typos-v${{ env.TYPOS_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          sha256: ${{ env.TYPOS_SHA256 }}
          origin: https://github.com
          directory: crate-ci/typos/releases/download/v${{ env.TYPOS_VERSION }}

      - name: Install typos
        env:
          TYPOS_ARCHIVE: ${{ steps.prose_typos_download.outputs.path }}
        run: |
          set -euo pipefail
          mkdir --parents "${RUNNER_TEMP}/typos-release"
          tar --extract --gzip \
            --file="${TYPOS_ARCHIVE}" \
            --directory="${RUNNER_TEMP}/typos-release"
          install --mode=0755 "${RUNNER_TEMP}/typos-release/typos" \
            "${RUNNER_TEMP}/typos"

      - name: Check commit-message spelling with typos
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/typos" \
            --config tools/lint/spell/typos/typos.toml \
            .commit-policy/messages

      - name: Restore Vale archive
        id: prose_vale_download
        uses: ./.github/actions/verified-download
        with:
          name: vale
          version: ${{ env.VALE_VERSION }}
          filename: vale_${{ env.VALE_VERSION }}_Linux_64-bit.tar.gz
          sha256: ${{ env.VALE_SHA256 }}
          origin: https://github.com
          directory: vale-cli/vale/releases/download/v${{ env.VALE_VERSION }}

      - name: Install Vale
        env:
          VALE_ARCHIVE: ${{ steps.prose_vale_download.outputs.path }}
        run: |
          set -euo pipefail
          tar --extract --gzip \
            --file="${VALE_ARCHIVE}" \
            --directory="${RUNNER_TEMP}" vale

      - name: Check commit-message prose with Vale
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/vale" --no-global \
            --config tools/lint/spell/vale/.vale.ini \
            .commit-policy/messages

      - name: Restore Lychee archive
        id: prose_lychee_download
        uses: ./.github/actions/verified-download
        with:
          name: lychee
          version: ${{ env.LYCHEE_VERSION }}
          filename: lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256: ${{ env.LYCHEE_SHA256 }}
          origin: https://github.com
          directory: lycheeverse/lychee/releases/download/lychee-v${{ env.LYCHEE_VERSION }}

      - name: Install Lychee
        env:
          LYCHEE_ARCHIVE: ${{ steps.prose_lychee_download.outputs.path }}
        run: |
          set -euo pipefail
          mkdir --parents "${RUNNER_TEMP}/lychee-release"
          tar --extract --gzip \
            --file="${LYCHEE_ARCHIVE}" \
            --directory="${RUNNER_TEMP}/lychee-release"
          install --mode=0755 \
            "${RUNNER_TEMP}/lychee-release/lychee-x86_64-unknown-linux-gnu/lychee" \
            "${RUNNER_TEMP}/lychee"

      - name: Check commit-message links with Lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/lychee" \
            --config tools/lint/spell/lychee/lychee.toml \
            .commit-policy/messages

# EOF
