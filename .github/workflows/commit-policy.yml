---
name: Commit Policy

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LUA_VERSION: "5.5.1"
  LUA_SHA256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"

jobs:
  structure:
    name: Structure, DCO, and OpenPGP
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Lua
        id: lua
        uses: ./.github/actions/setup-lua
        with:
          version: ${{ env.LUA_VERSION }}
          sha256: ${{ env.LUA_SHA256 }}

      - name: Select commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=''

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_BASE_SHA}"
              head_sha="${MERGE_HEAD_SHA}"
              ;;
            push)
              if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
                base_sha="${BEFORE_SHA}"
              else
                git fetch --no-tags origin \
                  "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
                base_sha="$(git merge-base "${head_sha}" "origin/${DEFAULT_BRANCH}")"
              fi
              ;;
            workflow_dispatch)
              base_sha="${head_sha}^"
              ;;
            *)
              printf '%s\n' "unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          git rev-list \
            --reverse \
            "${base_sha}..${head_sha}" \
            > "${RUNNER_TEMP}/commit-policy-shas"

          if [[ ! -s "${RUNNER_TEMP}/commit-policy-shas" ]]; then
            printf '%s\n' "${head_sha}" > "${RUNNER_TEMP}/commit-policy-shas"
          fi

      - name: Validate commit messages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LUA: ${{ steps.lua.outputs.lua }}
        run: |
          set -euo pipefail

          chmod 0755 .githooks/commit-msg

          while IFS= read -r sha; do
            printf 'Validating message: %s\n' "${sha}"
            "${LUA}" .githooks/commit-msg --commit "${sha}"
          done < "${RUNNER_TEMP}/commit-policy-shas"

      - name: Require GitHub-verified OpenPGP signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          while IFS= read -r sha; do
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${sha}")"

            verification_filter='.commit.verification.verified == true and '
            verification_filter+='(.commit.verification.signature != null) and '
            verification_filter+='(.commit.verification.signature | '
            verification_filter+='startswith("-----BEGIN PGP SIGNATURE-----"))'

            jq --exit-status "${verification_filter}" \
              <<< "${response}" \
              >/dev/null || {
                printf 'Commit %s does not have a GitHub-verified OpenPGP signature.\n' \
                  "${sha}" >&2
                exit 1
              }
          done < "${RUNNER_TEMP}/commit-policy-shas"


# EOF
