---

name: Reusable Lint

on:
  workflow_call:
    inputs:
      actions:
        description: Run the actions lint area.
        required: true
        type: boolean
      bazel:
        description: Run the bazel lint area.
        required: true
        type: boolean
      c:
        description: Run the c lint area.
        required: true
        type: boolean
      ci:
        description: Run the ci lint area.
        required: true
        type: boolean
      hooks:
        description: Run Git hook policy mock tests.
        required: true
        type: boolean
      json:
        description: Run the json lint area.
        required: true
        type: boolean
      lua:
        description: Run the lua lint area.
        required: true
        type: boolean
      markdown:
        description: Run the markdown lint area.
        required: true
        type: boolean
      nushell:
        description: Run the nushell lint area.
        required: true
        type: boolean
      powershell:
        description: Run the powershell lint area.
        required: true
        type: boolean
      python:
        description: Run the python lint area.
        required: true
        type: boolean
      shell:
        description: Run the shell lint area.
        required: true
        type: boolean
      toml:
        description: Run the toml lint area.
        required: true
        type: boolean
      yaml:
        description: Run the yaml lint area.
        required: true
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cache-plane:
    name: CI cache plane
    if: inputs.ci
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Lua
        id: lua
        uses: ./.github/actions/setup-lua

      - name: Validate runner-near cache plane
        uses: ./.github/actions/cache-plane

      - name: Enforce toolchain lock authority
        env:
          COIL_LUA: ${{ steps.lua.outputs.lua }}
        run: |
          set -euo pipefail

          "${COIL_LUA}" scripts/ci/check_toolchain.lua

  actionlint:
    name: GitHub Actions
    if: inputs.actions
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Restore actionlint archive
        id: actionlint_download
        uses: ./.github/actions/verified-download
        with:
          name: actionlint
          version: ${{ fromJSON(steps.toolchain.outputs.tools).actionlint.version }}
          filename: actionlint_${{ fromJSON(steps.toolchain.outputs.tools).actionlint.version }}_linux_amd64.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).actionlint.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'rhysd/actionlint/releases/download/v{0}',
              fromJSON(steps.toolchain.outputs.tools).actionlint.version
            ) }}

      - name: Install actionlint
        env:
          ACTIONLINT_ARCHIVE: ${{ steps.actionlint_download.outputs.path }}
        run: |
          set -euo pipefail

          destination="${ACTIONLINT_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${RUNNER_TEMP}" \
            actionlint

      - name: Run actionlint
        run: |
          set -euo pipefail

          mapfile -d '' workflows < <(
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 \
              | sort -z
          )

          printf 'Auditing %d GitHub Actions workflow(s):\n' "${#workflows[@]}"
          printf '  %s\n' "${workflows[@]}"

          "${RUNNER_TEMP}/actionlint" \
            -color \
            -config-file tools/lint/code/actions/actionlint.yaml \
            "${workflows[@]}"

  editorconfig:
    name: EditorConfig
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Restore EditorConfig Checker archive
        id: editorconfig_download
        uses: ./.github/actions/verified-download
        with:
          name: editorconfig-checker
          version: ${{ fromJSON(steps.toolchain.outputs.tools).editorconfig_checker.version }}
          filename: ec-linux-amd64.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).editorconfig_checker.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'editorconfig-checker/editorconfig-checker/releases/download/v{0}',
              fromJSON(steps.toolchain.outputs.tools).editorconfig_checker.version
            ) }}

      - name: Install EditorConfig Checker
        env:
          EDITORCONFIG_ARCHIVE: ${{ steps.editorconfig_download.outputs.path }}
        run: |
          set -euo pipefail

          destination="${EDITORCONFIG_ARCHIVE}"
          extract_dir="${RUNNER_TEMP}/editorconfig-checker"
          binary="${extract_dir}/bin/ec-linux-amd64"

          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${extract_dir}"

          if [[ ! -f "${binary}" ]]; then
            echo "EditorConfig Checker binary not found: ${binary}" >&2
            echo "Archive contents:" >&2
            tar \
              --list \
              --gzip \
              --file="${destination}" \
              >&2
            exit 1
          fi

          install \
            --mode=0755 \
            "${binary}" \
            "${RUNNER_TEMP}/ec"

      - name: Run EditorConfig Checker
        run: |
          set -euo pipefail

          "${RUNNER_TEMP}/ec"

  json:
    name: JSON and JSONC
    if: inputs.json
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Restore Biome binary
        id: biome_download
        uses: ./.github/actions/verified-download
        with:
          name: biome
          version: ${{ fromJSON(steps.toolchain.outputs.tools).biome.version }}
          filename: biome-linux-x64
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).biome.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'biomejs/biome/releases/download/%40biomejs/biome%40{0}',
              fromJSON(steps.toolchain.outputs.tools).biome.version
            ) }}

      - name: Install Biome
        env:
          BIOME_BINARY: ${{ steps.biome_download.outputs.path }}
        run: |
          set -euo pipefail

          install \
            --mode=0755 \
            "${BIOME_BINARY}" \
            "${RUNNER_TEMP}/biome"

      - name: Find and lint all JSON files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.json' '*.jsonc'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked JSON or JSONC files found."
            exit 0
          fi

          printf 'Linting %d JSON or JSONC file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/biome" \
            lint \
            --config-path tools/lint/code/json/biome-config.json \
            --error-on-warnings \
            --reporter github \
            "${files[@]}"

  yamllint:
    name: YAML
    if: inputs.yaml
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Install yamllint
        env:
          YAMLLINT_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).yamllint.version }}
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/yamllint"

          "${RUNNER_TEMP}/yamllint/bin/python" \
            -m pip \
            install \
            --disable-pip-version-check \
            --no-input \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Find and lint all YAML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.yml' '*.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked YAML files found."
            exit 0
          fi

          printf 'Linting %d YAML file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/yamllint/bin/yamllint" \
            --config-file tools/lint/code/yaml/yamllint.yml \
            --format github \
            "${files[@]}"

  taplo:
    name: TOML
    if: inputs.toml
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Install Taplo
        env:
          TAPLO_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).taplo.version }}
        run: |
          set -euo pipefail

          cargo install \
            taplo-cli \
            --version "${TAPLO_VERSION}" \
            --locked

      - name: Find and validate all TOML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked TOML files found."
            exit 0
          fi

          printf 'Linting %d TOML file(s).\n' "${#files[@]}"

          taplo \
            lint \
            --config tools/lint/code/taplo/taplo.toml \
            "${files[@]}"

      - name: Check TOML formatting
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            exit 0
          fi

          taplo \
            fmt \
            --config tools/lint/code/taplo/taplo.toml \
            --check \
            "${files[@]}"

  markdownlint:
    name: Markdown
    if: inputs.markdown
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(steps.toolchain.outputs.tools).node.version }}
          package-manager-cache: false

      - name: Find and lint all Markdown files
        env:
          MARKDOWNLINT_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).markdownlint.version }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.markdown'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked Markdown files found."
            exit 0
          fi

          printf 'Linting %d Markdown file(s).\n' "${#files[@]}"

          args=()

          for file in "${files[@]}"; do
            args+=(":${file}")
          done

          npx \
            --yes \
            "markdownlint-cli2@${MARKDOWNLINT_VERSION}" \
            --config tools/lint/code/md/markdownlint-cli2.jsonc \
            "${args[@]}"


  c:
    name: C
    if: inputs.c
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Restore clang-format wheel
        id: clang_format
        uses: ./.github/actions/verified-download
        with:
          name: clang-format
          version: ${{ fromJSON(steps.toolchain.outputs.tools).clang_format.version }}
          filename: >-
            ${{ format(
              'clang_format-{0}-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl',
              fromJSON(steps.toolchain.outputs.tools).clang_format.version
            ) }}
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).clang_format.sha256 }}
          origin: https://files.pythonhosted.org
          directory: packages/e5/88/b82c066fa807da4ca2518fecf79071361f6324b77375e5e92c059c0697fd

      - name: Restore clang-tidy wheel
        id: clang_tidy
        uses: ./.github/actions/verified-download
        with:
          name: clang-tidy
          version: ${{ fromJSON(steps.toolchain.outputs.tools).clang_tidy.version }}
          filename: >-
            ${{ format(
              'clang_tidy-{0}-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl',
              fromJSON(steps.toolchain.outputs.tools).clang_tidy.version
            ) }}
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).clang_tidy.sha256 }}
          origin: https://files.pythonhosted.org
          directory: packages/82/19/0f2668f8f5e2452b096a2b898f2b6bcecbceb6dd0c7f75d1755ce1f18d8b

      - name: Install pinned Clang tools
        env:
          CLANG_FORMAT_PACKAGE: ${{ steps.clang_format.outputs.path }}
          CLANG_TIDY_PACKAGE: ${{ steps.clang_tidy.outputs.path }}
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/coil-clang"
          "${RUNNER_TEMP}/coil-clang/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            "${CLANG_FORMAT_PACKAGE}" \
            "${CLANG_TIDY_PACKAGE}"

          "${RUNNER_TEMP}/coil-clang/bin/clang-format" --version
          "${RUNNER_TEMP}/coil-clang/bin/clang-tidy" --version

      - name: Setup pinned Lua
        id: lua
        uses: ./.github/actions/setup-lua

      - name: Run C checks
        env:
          COIL_CLANG_FORMAT: ${{ runner.temp }}/coil-clang/bin/clang-format
          COIL_CLANG_TIDY: ${{ runner.temp }}/coil-clang/bin/clang-tidy
          COIL_LUA: ${{ steps.lua.outputs.lua }}
        run: |
          set -euo pipefail

          "${COIL_LUA}" scripts/ci/check_c.lua
          "${COIL_LUA}" scripts/ci/check_modules.lua


  bazel:
    name: Bazel
    if: inputs.bazel
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Configure runner-near cache plane
        id: cache_plane
        uses: ./.github/actions/cache-plane

      - name: Test Bazel workspace when present
        env:
          COIL_BAZELRC: ${{ steps.cache_plane.outputs.bazelrc }}
        run: |
          set -euo pipefail

          workspace=false
          for marker in MODULE.bazel WORKSPACE.bazel WORKSPACE; do
            if [[ -f "${marker}" ]]; then
              workspace=true
              break
            fi
          done

          if [[ "${workspace}" != true ]]; then
            echo "No Bazel workspace found; cache integration is ready."
            exit 0
          fi

          if ! command -v bazel >/dev/null 2>&1; then
            printf '%s\n' \
              'Bazel workspace found, but bazel is not installed.' >&2
            exit 1
          fi

          bazel \
            --bazelrc="${COIL_BAZELRC}" \
            test \
            //...


  lua:
    name: Lua
    if: inputs.lua
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Detect Lua sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              *.lua)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])lua([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Lua sources found; skipping Lua lint."
          fi

      - name: Restore Lua archive
        id: lua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: lua
          version: ${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}
          filename: lua-${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).lua.sha256 }}
          origin: https://www.lua.org
          directory: ftp

      - name: Restore Selene archive
        id: selene_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: selene
          version: ${{ fromJSON(steps.toolchain.outputs.tools).selene.version }}
          filename: selene-${{ fromJSON(steps.toolchain.outputs.tools).selene.version }}-linux.zip
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).selene.sha256 }}
          origin: https://github.com
          directory: Kampfkarren/selene/releases/download/${{ fromJSON(steps.toolchain.outputs.tools).selene.version }}

      - name: Restore StyLua archive
        id: stylua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: stylua
          version: ${{ fromJSON(steps.toolchain.outputs.tools).stylua.version }}
          filename: stylua-linux-x86_64.zip
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).stylua.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'JohnnyMorganz/StyLua/releases/download/v{0}',
              fromJSON(steps.toolchain.outputs.tools).stylua.version
            ) }}

      - name: Restore LuaLS archive
        id: luals_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: lua-language-server
          version: ${{ fromJSON(steps.toolchain.outputs.tools).lua_language_server.version }}
          filename: >-
            ${{ format(
              'lua-language-server-{0}-linux-x64.tar.gz',
              fromJSON(steps.toolchain.outputs.tools).lua_language_server.version
            ) }}
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).lua_language_server.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'LuaLS/lua-language-server/releases/download/{0}',
              fromJSON(steps.toolchain.outputs.tools).lua_language_server.version
            ) }}

      - name: Install pinned Lua toolchain
        if: steps.detect.outputs.found == 'true'
        env:
          LUA_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}
          LUA_ARCHIVE: ${{ steps.lua_download.outputs.path }}
          SELENE_ARCHIVE: ${{ steps.selene_download.outputs.path }}
          STYLUA_ARCHIVE: ${{ steps.stylua_download.outputs.path }}
          LUALS_ARCHIVE: ${{ steps.luals_download.outputs.path }}
        run: |
          set -euo pipefail

          lua_archive="${LUA_ARCHIVE}"

          tar -xzf "${lua_archive}" -C "${RUNNER_TEMP}"
          make --directory="${RUNNER_TEMP}/lua-${LUA_VERSION}" \
            --jobs="$(nproc)" all

          selene_archive="${SELENE_ARCHIVE}"

          mkdir -p "${RUNNER_TEMP}/selene"
          unzip -q "${selene_archive}" -d "${RUNNER_TEMP}/selene"
          chmod 0755 "${RUNNER_TEMP}/selene/selene"

          stylua_archive="${STYLUA_ARCHIVE}"

          mkdir -p "${RUNNER_TEMP}/stylua"
          unzip -q "${stylua_archive}" -d "${RUNNER_TEMP}/stylua"
          chmod 0755 "${RUNNER_TEMP}/stylua/stylua"

          luals_archive="${LUALS_ARCHIVE}"

          mkdir -p "${RUNNER_TEMP}/luals"
          tar -xzf "${luals_archive}" -C "${RUNNER_TEMP}/luals"

      - name: Run Lua checks
        if: steps.detect.outputs.found == 'true'
        env:
          COIL_LUA: ${{ runner.temp }}/lua-${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}/src/lua
          COIL_LUAC: ${{ runner.temp }}/lua-${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}/src/luac
          COIL_LUALS: ${{ runner.temp }}/luals/bin/lua-language-server
          COIL_SELENE: ${{ runner.temp }}/selene/selene
          COIL_STYLUA: ${{ runner.temp }}/stylua/stylua
        run: |
          set -euo pipefail

