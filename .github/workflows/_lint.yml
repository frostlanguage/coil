        id: lychee_download
        uses: ./.github/actions/verified-download
        with:
          name: lychee
          version: ${{ fromJSON(steps.toolchain.outputs.tools).lychee.version }}
          filename: lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).lychee.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'lycheeverse/lychee/releases/download/lychee-v{0}',
              fromJSON(steps.toolchain.outputs.tools).lychee.version
            ) }}

      - name: Restore Gitleaks archive
        id: gitleaks_download
        uses: ./.github/actions/verified-download
        with:
          name: gitleaks
          version: ${{ fromJSON(steps.toolchain.outputs.tools).gitleaks.version }}
          filename: gitleaks_${{ fromJSON(steps.toolchain.outputs.tools).gitleaks.version }}_linux_x64.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).gitleaks.sha256 }}
          origin: https://github.com
          directory: >-
            ${{ format(
              'gitleaks/gitleaks/releases/download/v{0}',
              fromJSON(steps.toolchain.outputs.tools).gitleaks.version
            ) }}

      - name: Restore gittuf binary
        id: gittuf_download
        uses: ./.github/actions/verified-download
        with:
          name: gittuf
          version: ${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}
          filename: gittuf_${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}_linux_amd64
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).gittuf.sha256 }}
          origin: https://github.com
          directory: gittuf/gittuf/releases/download/v${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}

      - name: Restore git-remote-gittuf binary
        id: git_remote_gittuf_download
        uses: ./.github/actions/verified-download
        with:
          name: git-remote-gittuf
          version: ${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}
          filename: git-remote-gittuf_${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}_linux_amd64
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).gittuf.remote_sha256 }}
          origin: https://github.com
          directory: gittuf/gittuf/releases/download/v${{ fromJSON(steps.toolchain.outputs.tools).gittuf.version }}

      - name: Install pinned mock-test toolchain
        env:
          LUA_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).lua.version }}
          LUV_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).luv.version }}
          LUA_ARCHIVE: ${{ steps.lua_download.outputs.path }}
          LUV_ARCHIVE: ${{ steps.luv_download.outputs.path }}
          CODESPELL_PACKAGE: ${{ steps.codespell_download.outputs.path }}
          TYPOS_ARCHIVE: ${{ steps.typos_download.outputs.path }}
          VALE_ARCHIVE: ${{ steps.vale_download.outputs.path }}
          LYCHEE_ARCHIVE: ${{ steps.lychee_download.outputs.path }}
          GITLEAKS_ARCHIVE: ${{ steps.gitleaks_download.outputs.path }}
          GITTUF_BINARY: ${{ steps.gittuf_download.outputs.path }}
          GIT_REMOTE_GITTUF_BINARY: ${{ steps.git_remote_gittuf_download.outputs.path }}
        run: |
          set -euo pipefail

          bin_dir="${RUNNER_TEMP}/coil-mock-bin"
          mkdir --parents "${bin_dir}"

          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

          # Lua
          lua_destination="${LUA_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${lua_destination}" \
            --directory="${RUNNER_TEMP}"

          make \
            --directory="${RUNNER_TEMP}/lua-${LUA_VERSION}" \
            --jobs="$(nproc)" \
            all

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/lua" \
            "${bin_dir}/lua"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/luac" \
            "${bin_dir}/luac"

          # luv: the Lua hook mocks use libuv for portable process and filesystem IO.
          luv_destination="${LUV_ARCHIVE}"
          luv_source="${RUNNER_TEMP}/luv-${LUV_VERSION}"
          luv_build="${RUNNER_TEMP}/luv-build"
          lua_modules="${RUNNER_TEMP}/lua-modules"

          mkdir --parents "${luv_source}" "${lua_modules}"

          tar \
            --extract \
            --gzip \
            --strip-components=1 \
            --file="${luv_destination}" \
            --directory="${luv_source}"

          cmake \
            -S "${luv_source}" \
            -B "${luv_build}" \
            -DBUILD_MODULE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=OFF \
            -DWITH_LUA_ENGINE=Lua \
            -DLUA="${bin_dir}/lua" \
            -DLUA_INCDIR="${RUNNER_TEMP}/lua-${LUA_VERSION}/src" \
            -DLUA_LIBDIR="${RUNNER_TEMP}/lua-${LUA_VERSION}/src" \
            -DLUA_LIBFILE=liblua.a \
            -DLIBDIR="${lua_modules}" \
            -DLUADIR="${lua_modules}"

          cmake --build "${luv_build}" --parallel "$(nproc)"
          cmake --install "${luv_build}"

          printf 'LUA_CPATH=%s\n' \
            "${lua_modules}/?.so;;" \
            >> "${GITHUB_ENV}"

          # CSpell integration stub. The dedicated spelling workflow executes
          # the real pinned CSpell action; this suite only verifies hook wiring.
          cat > "${bin_dir}/cspell" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == "--version" ]]; then
            echo "coil-cspell-hook-mock"
            exit 0
          fi

          input="$(cat)"

          if [[ "${input}" == *qxylophoniczz* ]]; then
            exit 1
          fi
          EOF

          chmod 0755 "${bin_dir}/cspell"

          # codespell
          codespell_destination="${CODESPELL_PACKAGE}"

          python3 -m venv "${RUNNER_TEMP}/codespell"

          "${RUNNER_TEMP}/codespell/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            "${codespell_destination}"

          ln \
            --symbolic \
            "${RUNNER_TEMP}/codespell/bin/codespell" \
            "${bin_dir}/codespell"

          # typos
          typos_destination="${TYPOS_ARCHIVE}"

          mkdir --parents "${RUNNER_TEMP}/typos-release"

          tar \
            --extract \
            --gzip \
            --file="${typos_destination}" \
            --directory="${RUNNER_TEMP}/typos-release"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/typos-release/typos" \
            "${bin_dir}/typos"

          # Vale
          vale_destination="${VALE_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${vale_destination}" \
            --directory="${RUNNER_TEMP}" \
            vale

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/vale" \
            "${bin_dir}/vale"

          # Lychee
          lychee_destination="${LYCHEE_ARCHIVE}"

          mkdir --parents "${RUNNER_TEMP}/lychee-release"

          tar \
            --extract \
            --gzip \
            --file="${lychee_destination}" \
            --directory="${RUNNER_TEMP}/lychee-release"

          install \
            --mode=0755 \
            "${RUNNER_TEMP}/lychee-release/lychee-x86_64-unknown-linux-gnu/lychee" \
            "${bin_dir}/lychee"

          # Gitleaks
          gitleaks_destination="${GITLEAKS_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${gitleaks_destination}" \
            --directory="${bin_dir}" \
            gitleaks

          chmod 0755 "${bin_dir}/gitleaks"

          # gittuf
          install \
            --mode=0755 \
            "${GITTUF_BINARY}" \
            "${bin_dir}/gittuf"

          install \
            --mode=0755 \
            "${GIT_REMOTE_GITTUF_BINARY}" \
            "${bin_dir}/git-remote-gittuf"

      - name: Show mock-test tool versions
        run: |
          set -euo pipefail

          lua -v
          lua -e 'require("luv"); print("luv OK")'
          cspell --version
          codespell --version
          typos --version
          vale --version
          lychee --version
          gitleaks version
          gittuf version

      - name: Run Git hook mock suites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          chmod 0755 \
            .githooks/pre-commit \
            .githooks/commit-msg \
            .githooks/pre-push

          lua scripts/ci/check_hooks.lua

# EOF
