---

name: Reusable Lint

on:
  workflow_call:
    inputs:
      actions:
        description: Run the actions lint area.
        required: true
        type: boolean
      bazel:
        description: Run the bazel lint area.
        required: true
        type: boolean
      c:
        description: Run the c lint area.
        required: true
        type: boolean
      ci:
        description: Run the ci lint area.
        required: true
        type: boolean
      hooks:
        description: Run Git hook policy mock tests.
        required: true
        type: boolean
      json:
        description: Run the json lint area.
        required: true
        type: boolean
      lua:
        description: Run the lua lint area.
        required: true
        type: boolean
      markdown:
        description: Run the markdown lint area.
        required: true
        type: boolean
      nushell:
        description: Run the nushell lint area.
        required: true
        type: boolean
      powershell:
        description: Run the powershell lint area.
        required: true
        type: boolean
      python:
        description: Run the python lint area.
        required: true
        type: boolean
      shell:
        description: Run the shell lint area.
        required: true
        type: boolean
      toml:
        description: Run the toml lint area.
        required: true
        type: boolean
      yaml:
        description: Run the yaml lint area.
        required: true
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  BIOME_VERSION: "2.5.10"
  BIOME_SHA256: "511592536991d4b07179d063b93ff0c092ccedba556a4b1ea70d12d46ea0785a"
  EDITORCONFIG_CHECKER_VERSION: "3.11.2"
  EDITORCONFIG_CHECKER_SHA256: "bc815e5b3b1891a0ee9e1242fe3475312655f8b0f4c4a79510be0a009294571a"
  YAMLLINT_VERSION: "1.38.0"
  TAPLO_VERSION: "0.10.0"
  MARKDOWNLINT_VERSION: "0.23.2"
  CLANG_FORMAT_VERSION: "22.1.8"
  CLANG_FORMAT_SHA256: "b00cff6bfd1f1686f073a4fdf1cb937dbd58bf7510c659477805c03afdea0816"
  CLANG_TIDY_VERSION: "22.1.8"
  CLANG_TIDY_SHA256: "1a3de07ba82d4403d8b692ae63a5520d4db5c606014c92c24bbcef9259057bf1"
  LUA_VERSION: "5.5.1"
  LUA_SHA256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"
  SELENE_VERSION: "0.31.0"
  SELENE_SHA256: "dac452422747999ec4919bbb8bb52992b66aae533b60022bf005669de8616671"
  STYLUA_VERSION: "2.5.2"
  STYLUA_SHA256: "bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab"
  LUALS_VERSION: "3.19.1"
  LUALS_SHA256: "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8"
  RUFF_VERSION: "0.16.4"
  RUFF_SHA256: "9cb1234804ddb0f7f57cef3f81623ce5acb990e40af7cce08dc7778c9d7ee96c"
  PYRIGHT_VERSION: "1.1.411"
  PYRIGHT_SHA256: "bd5c488fc20fa237a944279bf32cae2f986cf10d5d5d9e8705819859daeb2f4a"
  BANDIT_VERSION: "1.9.4"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  SHFMT_VERSION: "3.13.1"
  SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
  POWERSHELL_VERSION: "7.6.5"
  POWERSHELL_SHA256: "b34ab3b19acac1d3d4d0d3cfdb02acf62f457b0b6a962ff008132033f7566844"
  PSSCRIPTANALYZER_VERSION: "1.25.0"
  PSSCRIPTANALYZER_SHA256: "14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60"
  NUSHELL_VERSION: "0.115.1"
  NUSHELL_SHA256: "d11d825241f6504a3617c535fa725a9dd6d009c86d7b19fb3168b47635b9d8b0"
  NUFMT_REVISION: "7cfd3b7eacf5a9feb22777230e3076038f2e9e8d"
  LUV_VERSION: "1.52.1-0"
  LUV_SHA256: "3e6eb820a3aee034f85f9cce9bd77b5d42f34d128a1ccec877adf28c913577c7"
  CODESPELL_VERSION: "2.4.1"
  CODESPELL_SHA256: "3dadafa67df7e4a3dbf51e0d7315061b80d265f9552ebd699b3dd6834b47e425"
  LYCHEE_VERSION: "0.24.1"
  LYCHEE_SHA256: "3ecad9a6e5ec42efaa9cdbdbad2406fdeef11ee38f7774aaf038f981d3248684"
  TYPOS_VERSION: "1.46.0"
  TYPOS_SHA256: "c62a626df385c96574743fd4974aeb271a41a67d080a0398e36e1a42782f614a"
  VALE_VERSION: "3.18.0"
  VALE_SHA256: "a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITTUF_VERSION: "0.15.0"
  GITTUF_SHA256: "e60629e4d165bf47ac450fde834af20d7c5ff1f08f15d685980c37b9d522ae1d"
  GIT_REMOTE_GITTUF_SHA256: "7029c8f026b574622087110162dff27a3cb15d73161fdecee9ef65c76e50dedf"

jobs:
  cache-plane:
    name: CI cache plane
    if: inputs.ci
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate runner-near cache plane
        uses: ./.github/actions/cache-plane

  actionlint:
    name: GitHub Actions
    if: inputs.actions
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore actionlint archive
        id: actionlint_download
        uses: ./.github/actions/verified-download
        with:
          name: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          filename: actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.ACTIONLINT_SHA256 }}
          origin: https://github.com
          directory: rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        env:
          ACTIONLINT_ARCHIVE: ${{ steps.actionlint_download.outputs.path }}
        run: |
          set -euo pipefail

          destination="${ACTIONLINT_ARCHIVE}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${RUNNER_TEMP}" \
            actionlint

      - name: Run actionlint
        run: |
          set -euo pipefail

          mapfile -d '' workflows < <(
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 \
              | sort -z
          )

          printf 'Auditing %d GitHub Actions workflow(s):\n' "${#workflows[@]}"
          printf '  %s\n' "${workflows[@]}"

          "${RUNNER_TEMP}/actionlint" \
            -color \
            -config-file tools/lint/code/actions/actionlint.yaml \
            "${workflows[@]}"

  editorconfig:
    name: EditorConfig
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore EditorConfig Checker archive
        id: editorconfig_download
        uses: ./.github/actions/verified-download
        with:
          name: editorconfig-checker
          version: ${{ env.EDITORCONFIG_CHECKER_VERSION }}
          filename: ec-linux-amd64.tar.gz
          sha256: ${{ env.EDITORCONFIG_CHECKER_SHA256 }}
          origin: https://github.com
          directory: >-
            editorconfig-checker/editorconfig-checker/releases/download/v${{ env.EDITORCONFIG_CHECKER_VERSION }}

      - name: Install EditorConfig Checker
        env:
          EDITORCONFIG_ARCHIVE: ${{ steps.editorconfig_download.outputs.path }}
        run: |
          set -euo pipefail

          destination="${EDITORCONFIG_ARCHIVE}"
          extract_dir="${RUNNER_TEMP}/editorconfig-checker"
          binary="${extract_dir}/bin/ec-linux-amd64"

          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${extract_dir}"

          if [[ ! -f "${binary}" ]]; then
            echo "EditorConfig Checker binary not found: ${binary}" >&2
            echo "Archive contents:" >&2
            tar \
              --list \
              --gzip \
              --file="${destination}" \
              >&2
            exit 1
          fi

          install \
            --mode=0755 \
            "${binary}" \
            "${RUNNER_TEMP}/ec"

      - name: Run EditorConfig Checker
        run: |
          set -euo pipefail

          "${RUNNER_TEMP}/ec"

  json:
    name: JSON and JSONC
    if: inputs.json
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Biome binary
        id: biome_download
        uses: ./.github/actions/verified-download
        with:
          name: biome
          version: ${{ env.BIOME_VERSION }}
          filename: biome-linux-x64
          sha256: ${{ env.BIOME_SHA256 }}
          origin: https://github.com
          directory: >-
            biomejs/biome/releases/download/%40biomejs/biome%40${{ env.BIOME_VERSION }}

      - name: Install Biome
        env:
          BIOME_BINARY: ${{ steps.biome_download.outputs.path }}
        run: |
          set -euo pipefail

          install \
            --mode=0755 \
            "${BIOME_BINARY}" \
            "${RUNNER_TEMP}/biome"

      - name: Find and lint all JSON files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.json' '*.jsonc'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked JSON or JSONC files found."
            exit 0
          fi

          printf 'Linting %d JSON or JSONC file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/biome" \
            lint \
            --config-path tools/lint/code/json/biome-config.json \
            --error-on-warnings \
            --reporter github \
            "${files[@]}"

  yamllint:
    name: YAML
    if: inputs.yaml
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/yamllint"

          "${RUNNER_TEMP}/yamllint/bin/python" \
            -m pip \
            install \
            --disable-pip-version-check \
            --no-input \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Find and lint all YAML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.yml' '*.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked YAML files found."
            exit 0
          fi

          printf 'Linting %d YAML file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/yamllint/bin/yamllint" \
            --config-file tools/lint/code/yaml/yamllint.yml \
            --format github \
            "${files[@]}"

  taplo:
    name: TOML
    if: inputs.toml
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Taplo
        run: |
          set -euo pipefail

          cargo install \
            taplo-cli \
            --version "${TAPLO_VERSION}" \
            --locked

      - name: Find and validate all TOML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked TOML files found."
            exit 0
          fi

          printf 'Linting %d TOML file(s).\n' "${#files[@]}"

          taplo \
            lint \
            --config tools/lint/code/taplo/taplo.toml \
            "${files[@]}"

      - name: Check TOML formatting
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            exit 0
          fi

          taplo \
            fmt \
            --config tools/lint/code/taplo/taplo.toml \
            --check \
            "${files[@]}"

  markdownlint:
    name: Markdown
    if: inputs.markdown
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Find and lint all Markdown files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.markdown'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked Markdown files found."
            exit 0
          fi

          printf 'Linting %d Markdown file(s).\n' "${#files[@]}"

          args=()

          for file in "${files[@]}"; do
            args+=(":${file}")
          done

          npx \
            --yes \
            "markdownlint-cli2@${MARKDOWNLINT_VERSION}" \
            --config tools/lint/code/md/markdownlint-cli2.jsonc \
            "${args[@]}"


  c:
    name: C
    if: inputs.c
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore clang-format wheel
        id: clang_format
        uses: ./.github/actions/verified-download
        with:
          name: clang-format
          version: ${{ env.CLANG_FORMAT_VERSION }}
          filename: >-
            clang_format-22.1.8-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          sha256: ${{ env.CLANG_FORMAT_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/e5/88/b82c066fa807da4ca2518fecf79071361f6324b77375e5e92c059c0697fd

      - name: Restore clang-tidy wheel
        id: clang_tidy
        uses: ./.github/actions/verified-download
        with:
          name: clang-tidy
          version: ${{ env.CLANG_TIDY_VERSION }}
          filename: >-
            clang_tidy-22.1.8-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          sha256: ${{ env.CLANG_TIDY_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/82/19/0f2668f8f5e2452b096a2b898f2b6bcecbceb6dd0c7f75d1755ce1f18d8b

      - name: Install pinned Clang tools
        env:
          CLANG_FORMAT_PACKAGE: ${{ steps.clang_format.outputs.path }}
          CLANG_TIDY_PACKAGE: ${{ steps.clang_tidy.outputs.path }}
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/coil-clang"
          "${RUNNER_TEMP}/coil-clang/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            "${CLANG_FORMAT_PACKAGE}" \
            "${CLANG_TIDY_PACKAGE}"

          "${RUNNER_TEMP}/coil-clang/bin/clang-format" --version
          "${RUNNER_TEMP}/coil-clang/bin/clang-tidy" --version

      - name: Setup pinned Lua
        id: lua
        uses: ./.github/actions/setup-lua
        with:
          version: ${{ env.LUA_VERSION }}
          sha256: ${{ env.LUA_SHA256 }}

      - name: Run C checks
        env:
          COIL_CLANG_FORMAT: ${{ runner.temp }}/coil-clang/bin/clang-format
          COIL_CLANG_TIDY: ${{ runner.temp }}/coil-clang/bin/clang-tidy
          COIL_LUA: ${{ steps.lua.outputs.lua }}
        run: |
          set -euo pipefail

          "${COIL_LUA}" scripts/ci/check_c.lua
          "${COIL_LUA}" scripts/ci/check_modules.lua


  bazel:
    name: Bazel
    if: inputs.bazel
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure runner-near cache plane
        id: cache_plane
        uses: ./.github/actions/cache-plane

      - name: Test Bazel workspace when present
        env:
          COIL_BAZELRC: ${{ steps.cache_plane.outputs.bazelrc }}
        run: |
          set -euo pipefail

          workspace=false
          for marker in MODULE.bazel WORKSPACE.bazel WORKSPACE; do
            if [[ -f "${marker}" ]]; then
              workspace=true
              break
            fi
          done

          if [[ "${workspace}" != true ]]; then
            echo "No Bazel workspace found; cache integration is ready."
            exit 0
          fi

          if ! command -v bazel >/dev/null 2>&1; then
            printf '%s\n' \
              'Bazel workspace found, but bazel is not installed.' >&2
            exit 1
          fi

          bazel \
            --bazelrc="${COIL_BAZELRC}" \
            test \
            //...


  lua:
    name: Lua
    if: inputs.lua
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Lua sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              *.lua)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])lua([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Lua sources found; skipping Lua lint."
          fi

      - name: Restore Lua archive
        id: lua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: lua
          version: ${{ env.LUA_VERSION }}
          filename: lua-${{ env.LUA_VERSION }}.tar.gz
          sha256: ${{ env.LUA_SHA256 }}
          origin: https://www.lua.org
          directory: ftp

      - name: Restore Selene archive
        id: selene_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: selene
          version: ${{ env.SELENE_VERSION }}
          filename: selene-${{ env.SELENE_VERSION }}-linux.zip
          sha256: ${{ env.SELENE_SHA256 }}
          origin: https://github.com
          directory: Kampfkarren/selene/releases/download/${{ env.SELENE_VERSION }}

      - name: Restore StyLua archive
        id: stylua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: stylua
          version: ${{ env.STYLUA_VERSION }}
          filename: stylua-linux-x86_64.zip
          sha256: ${{ env.STYLUA_SHA256 }}
          origin: https://github.com
          directory: JohnnyMorganz/StyLua/releases/download/v${{ env.STYLUA_VERSION }}

      - name: Restore LuaLS archive
