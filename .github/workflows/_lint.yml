  python:
    name: Python
    if: inputs.python
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Detect Python sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              *.py|*.pyi)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*python([0-9.]*)?([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Python sources found; skipping Python lint."
          fi

      - name: Setup Node.js for Pyright
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(steps.toolchain.outputs.tools).node.version }}
          package-manager-cache: false

      - name: Restore Ruff archive
        id: ruff_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: ruff
          version: ${{ fromJSON(steps.toolchain.outputs.tools).ruff.version }}
          filename: ruff-x86_64-unknown-linux-gnu.tar.gz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).ruff.sha256 }}
          origin: https://github.com
          directory: astral-sh/ruff/releases/download/${{ fromJSON(steps.toolchain.outputs.tools).ruff.version }}

      - name: Restore Pyright archive
        id: pyright_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: pyright
          version: ${{ fromJSON(steps.toolchain.outputs.tools).pyright.version }}
          filename: pyright.tgz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).pyright.sha256 }}
          origin: https://github.com
          directory: microsoft/pyright/releases/download/${{ fromJSON(steps.toolchain.outputs.tools).pyright.version }}

      - name: Install Python lint tools
        if: steps.detect.outputs.found == 'true'
        env:
          BANDIT_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).bandit.version }}
          RUFF_ARCHIVE: ${{ steps.ruff_download.outputs.path }}
          PYRIGHT_ARCHIVE: ${{ steps.pyright_download.outputs.path }}
        run: |
          set -euo pipefail

          ruff_archive="${RUFF_ARCHIVE}"

          mkdir -p "${RUNNER_TEMP}/ruff"
          tar -xzf "${ruff_archive}" -C "${RUNNER_TEMP}/ruff" \
            --strip-components=1

          pyright_archive="${PYRIGHT_ARCHIVE}"

          mkdir -p "${RUNNER_TEMP}/pyright"
          tar -xzf "${pyright_archive}" \
            -C "${RUNNER_TEMP}/pyright" \
            --strip-components=1

          python3 -m venv "${RUNNER_TEMP}/bandit"

          "${RUNNER_TEMP}/bandit/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-input \
            "bandit==${BANDIT_VERSION}"

      - name: Run Python checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_python_files() {
            while IFS= read -r -d '' file; do
              case "${file}" in
                *.py|*.pyi)
                  printf '%s\0' "${file}"
                  continue
                  ;;
              esac

              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${first_line}" =~ ^#!.*python([0-9.]*)?([[:space:]]|$) ]]; then
                printf '%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          mapfile -d '' files < <(collect_python_files)
          mapfile -d '' py_files < <(
            printf '%s\0' "${files[@]}" \
              | while IFS= read -r -d '' file; do
                  [[ "${file}" == *.py ]] && printf '%s\0' "${file}"
                done
          )

          printf 'Checking %d Python source file(s).\n' "${#files[@]}"

          if (( ${#py_files[@]} > 0 )); then
            python3 -m compileall -q "${py_files[@]}"
          fi

          "${RUNNER_TEMP}/ruff/ruff" \
            check \
            --config tools/lint/code/python/ruff.toml \
            "${files[@]}"

          "${RUNNER_TEMP}/ruff/ruff" \
            format \
            --check \
            --config tools/lint/code/python/ruff.toml \
            "${files[@]}"

          node "${RUNNER_TEMP}/pyright/index.js" \
            --project tools/lint/code/python/pyrightconfig.json \
            "${files[@]}"

          if (( ${#py_files[@]} > 0 )); then
            "${RUNNER_TEMP}/bandit/bin/bandit" \
              --configfile tools/lint/code/python/bandit.yaml \
              "${py_files[@]}"
          fi

  shell:
    name: POSIX sh and Bash
    if: inputs.shell
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain lock
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Detect shell sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            case "${file}" in
              *.sh|*.bash)
                found=true
                break
                ;;
            esac

            if [[ "${first_line}" =~ ^#!.*(bash|/sh|env[[:space:]]+sh)([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked POSIX sh or Bash sources found; skipping shell lint."
          fi

      - name: Restore ShellCheck archive
        id: shellcheck_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: shellcheck
          version: ${{ fromJSON(steps.toolchain.outputs.tools).shellcheck.version }}
          filename: >-
            shellcheck-v${{ fromJSON(steps.toolchain.outputs.tools).shellcheck.version }}.linux.x86_64.tar.xz
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).shellcheck.sha256 }}
          origin: https://github.com
          directory: >-
            koalaman/shellcheck/releases/download/v${{ fromJSON(steps.toolchain.outputs.tools).shellcheck.version }}

      - name: Restore shfmt binary
        id: shfmt_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: shfmt
          version: ${{ fromJSON(steps.toolchain.outputs.tools).shfmt.version }}
          filename: shfmt_v${{ fromJSON(steps.toolchain.outputs.tools).shfmt.version }}_linux_amd64
          sha256: ${{ fromJSON(steps.toolchain.outputs.tools).shfmt.sha256 }}
          origin: https://github.com
          directory: mvdan/sh/releases/download/v${{ fromJSON(steps.toolchain.outputs.tools).shfmt.version }}

      - name: Install ShellCheck and shfmt
        if: steps.detect.outputs.found == 'true'
        env:
          SHELLCHECK_VERSION: ${{ fromJSON(steps.toolchain.outputs.tools).shellcheck.version }}
          SHELLCHECK_ARCHIVE: ${{ steps.shellcheck_download.outputs.path }}
          SHFMT_BINARY: ${{ steps.shfmt_download.outputs.path }}
        run: |
          set -euo pipefail

          shellcheck_archive="${SHELLCHECK_ARCHIVE}"

          tar -xJf "${shellcheck_archive}" -C "${RUNNER_TEMP}"

          install --mode=0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/shellcheck"

          shfmt_binary="${RUNNER_TEMP}/shfmt"
          install \
            --mode=0755 \
            "${SHFMT_BINARY}" \
            "${shfmt_binary}"

      - name: Run POSIX sh and Bash checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_shell_files() {
            while IFS= read -r -d '' file; do
              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${file}" == *.bash || "${first_line}" =~ bash ]]; then
                printf 'bash\t%s\0' "${file}"
              elif [[ "${file}" == *.sh || "${first_line}" =~ ^#!.*(/sh|env[[:space:]]+sh)([[:space:]]|$) ]]; then
                printf 'posix\t%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          posix_files=()
          bash_files=()

          while IFS= read -r -d '' record; do
            dialect="${record%%$'\t'*}"
            file="${record#*$'\t'}"

            if [[ "${dialect}" == bash ]]; then
              bash_files+=("${file}")
            else
              posix_files+=("${file}")
            fi
          done < <(collect_shell_files)

          if (( ${#posix_files[@]} > 0 )); then
            printf 'Checking %d POSIX sh file(s).\n' "${#posix_files[@]}"

            "${RUNNER_TEMP}/shellcheck" \
              --shell=sh \
              --rcfile=tools/lint/code/shell/posix/shellcheckrc \
              "${posix_files[@]}"

            "${RUNNER_TEMP}/shfmt" \
              -d \
              -ln posix \
              "${posix_files[@]}"
          fi

          if (( ${#bash_files[@]} > 0 )); then
            printf 'Checking %d Bash file(s).\n' "${#bash_files[@]}"

            "${RUNNER_TEMP}/shellcheck" \
              --shell=bash \
              --rcfile=tools/lint/code/shell/bash/shellcheckrc \
              "${bash_files[@]}"

            "${RUNNER_TEMP}/shfmt" \
              -d \
              -ln bash \
              "${bash_files[@]}"

            if command -v bash >/dev/null 2>&1; then
              for file in "${bash_files[@]}"; do
                bash -n "${file}"
              done
            else
              echo "Bash is unavailable; bash -n parser check skipped."
            fi
          fi

  powershell:
