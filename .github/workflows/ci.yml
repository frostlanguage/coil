---
name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      actions: ${{ steps.detect.outputs.actions }}
      bazel: ${{ steps.detect.outputs.bazel }}
      c: ${{ steps.detect.outputs.c }}
      ci: ${{ steps.detect.outputs.ci }}
      hooks: ${{ steps.detect.outputs.hooks }}
      json: ${{ steps.detect.outputs.json }}
      lua: ${{ steps.detect.outputs.lua }}
      markdown: ${{ steps.detect.outputs.markdown }}
      nushell: ${{ steps.detect.outputs.nushell }}
      powershell: ${{ steps.detect.outputs.powershell }}
      python: ${{ steps.detect.outputs.python }}
      security: ${{ steps.detect.outputs.security }}
      shell: ${{ steps.detect.outputs.shell }}
      spelling: ${{ steps.detect.outputs.spelling }}
      toml: ${{ steps.detect.outputs.toml }}
      yaml: ${{ steps.detect.outputs.yaml }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base: >-
            ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          force-all: >-
            ${{
              github.event_name == 'merge_group' ||
              github.event_name == 'workflow_dispatch' ||
              startsWith(github.ref, 'refs/tags/') ||
              (github.event_name == 'push' &&
              github.ref_name == github.event.repository.default_branch)
            }}

  lint:
    name: Lint
    needs:
      - changes
    uses: ./.github/workflows/_lint.yml
    permissions:
      contents: read
    with:
      actions: ${{ needs.changes.outputs.actions == 'true' }}
      bazel: ${{ needs.changes.outputs.bazel == 'true' }}
      c: ${{ needs.changes.outputs.c == 'true' }}
      ci: ${{ needs.changes.outputs.ci == 'true' }}
      hooks: ${{ needs.changes.outputs.hooks == 'true' }}
      json: ${{ needs.changes.outputs.json == 'true' }}
      lua: ${{ needs.changes.outputs.lua == 'true' }}
      markdown: ${{ needs.changes.outputs.markdown == 'true' }}
      nushell: ${{ needs.changes.outputs.nushell == 'true' }}
      powershell: ${{ needs.changes.outputs.powershell == 'true' }}
      python: ${{ needs.changes.outputs.python == 'true' }}
      shell: ${{ needs.changes.outputs.shell == 'true' }}
      toml: ${{ needs.changes.outputs.toml == 'true' }}
      yaml: ${{ needs.changes.outputs.yaml == 'true' }}

  spelling:
    name: Spelling and prose
    needs:
      - changes
    uses: ./.github/workflows/_spelling.yml
    permissions:
      contents: read
    with:
      repository: ${{ needs.changes.outputs.spelling == 'true' }}

  reuse:
    name: REUSE
    uses: ./.github/workflows/_reuse.yml
    permissions:
      contents: read

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - lint
      - spelling
      - reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful CI graph
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SPELLING_RESULT: ${{ needs.spelling.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
        run: |
          set -euo pipefail

          test "${CHANGES_RESULT}" = success
          test "${LINT_RESULT}" = success
          test "${REUSE_RESULT}" = success

          case "${SPELLING_RESULT}" in
            success|skipped)
              ;;
            *)
              printf 'Spelling workflow result: %s\n' "${SPELLING_RESULT}" >&2
              exit 1
              ;;
          esac
