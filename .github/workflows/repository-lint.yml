          while IFS= read -r -d '' file; do
            case "${file}" in
              tools/lint/code/shell/nushell/*)
                continue
                ;;
              *.nu)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])nu([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Nushell sources found; skipping Nushell lint."
          fi

      - name: Install pinned Nushell and nufmt
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          nu_archive="${RUNNER_TEMP}/nushell.tar.gz"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/nushell/nushell/releases/download/${NUSHELL_VERSION}/nu-${NUSHELL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${nu_archive}"

          printf '%s  %s\n' "${NUSHELL_SHA256}" "${nu_archive}" \
            | sha256sum --check --strict

          mkdir -p "${RUNNER_TEMP}/nushell"
          tar -xzf "${nu_archive}" \
            -C "${RUNNER_TEMP}/nushell" \
            --strip-components=1

          cargo install \
            --git https://github.com/nushell/nufmt \
            --rev "${NUFMT_REVISION}" \
            --locked \
            --root "${RUNNER_TEMP}/nufmt"

      - name: Run Nushell checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_nushell_files() {
            while IFS= read -r -d '' file; do
              case "${file}" in
                tools/lint/code/shell/nushell/*)
                  continue
                  ;;
                *.nu)
                  printf '%s\0' "${file}"
                  continue
                  ;;
              esac

              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])nu([[:space:]]|$) ]]; then
                printf '%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          mapfile -d '' files < <(collect_nushell_files)

          printf 'Checking %d Nushell source file(s).\n' "${#files[@]}"

          for file in "${files[@]}"; do
            "${RUNNER_TEMP}/nushell/nu" --check "${file}"
          done

          "${RUNNER_TEMP}/nufmt/bin/nufmt" \
            --dry-run \
            --config tools/lint/code/shell/nushell/nufmt.nuon \
            "${files[@]}"

          if command -v nu-lint >/dev/null 2>&1; then
            nu-lint "${files[@]}"
          else
            echo "Optional nu-lint executable not installed; skipping."
          fi

