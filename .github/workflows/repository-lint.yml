---

name: Repository Lint

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
  merge_group: {}
  release:
    types:
      - published
      - prereleased
      - released
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  BIOME_VERSION: "2.5.10"
  BIOME_SHA256: "511592536991d4b07179d063b93ff0c092ccedba556a4b1ea70d12d46ea0785a"
  EDITORCONFIG_CHECKER_VERSION: "3.11.2"
  EDITORCONFIG_CHECKER_SHA256: "bc815e5b3b1891a0ee9e1242fe3475312655f8b0f4c4a79510be0a009294571a"
  YAMLLINT_VERSION: "1.38.0"
  TAPLO_VERSION: "0.10.0"
  MARKDOWNLINT_VERSION: "0.23.2"
  CLANG_FORMAT_VERSION: "22.1.8"
  CLANG_FORMAT_SHA256: "b00cff6bfd1f1686f073a4fdf1cb937dbd58bf7510c659477805c03afdea0816"
  CLANG_TIDY_VERSION: "22.1.8"
  CLANG_TIDY_SHA256: "1a3de07ba82d4403d8b692ae63a5520d4db5c606014c92c24bbcef9259057bf1"
  LUA_VERSION: "5.5.1"
  LUA_SHA256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"
  SELENE_VERSION: "0.31.0"
  SELENE_SHA256: "dac452422747999ec4919bbb8bb52992b66aae533b60022bf005669de8616671"
  STYLUA_VERSION: "2.5.2"
  STYLUA_SHA256: "bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab"
  LUALS_VERSION: "3.19.1"
  LUALS_SHA256: "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8"
  RUFF_VERSION: "0.16.4"
  RUFF_SHA256: "9cb1234804ddb0f7f57cef3f81623ce5acb990e40af7cce08dc7778c9d7ee96c"
  PYRIGHT_VERSION: "1.1.411"
  PYRIGHT_SHA256: "bd5c488fc20fa237a944279bf32cae2f986cf10d5d5d9e8705819859daeb2f4a"
  BANDIT_VERSION: "1.9.4"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  SHFMT_VERSION: "3.13.1"
  SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
  POWERSHELL_VERSION: "7.6.5"
  POWERSHELL_SHA256: "b34ab3b19acac1d3d4d0d3cfdb02acf62f457b0b6a962ff008132033f7566844"
  PSSCRIPTANALYZER_VERSION: "1.25.0"
  PSSCRIPTANALYZER_SHA256: "14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60"
  NUSHELL_VERSION: "0.115.1"
  NUSHELL_SHA256: "d11d825241f6504a3617c535fa725a9dd6d009c86d7b19fb3168b47635b9d8b0"
  NUFMT_REVISION: "7cfd3b7eacf5a9feb22777230e3076038f2e9e8d"

jobs:
  cache-plane:
    name: CI cache plane
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate runner-near cache plane
        uses: ./.github/actions/cache-plane

  actionlint:
    name: GitHub Actions
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore actionlint archive
        id: actionlint_download
        uses: ./.github/actions/verified-download
        with:
          name: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          filename: actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.ACTIONLINT_SHA256 }}
          origin: https://github.com
          directory: rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        run: |
          set -euo pipefail

          destination="${{ steps.actionlint_download.outputs.path }}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${RUNNER_TEMP}" \
            actionlint

      - name: Run actionlint
        run: |
          set -euo pipefail

          mapfile -d '' workflows < <(
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 \
              | sort -z
          )

          printf 'Auditing %d GitHub Actions workflow(s):\n' "${#workflows[@]}"
          printf '  %s\n' "${workflows[@]}"

          "${RUNNER_TEMP}/actionlint" \
            -color \
            -config-file tools/lint/code/actions/actionlint.yaml \
            "${workflows[@]}"

  editorconfig:
    name: EditorConfig
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore EditorConfig Checker archive
        id: editorconfig_download
        uses: ./.github/actions/verified-download
        with:
          name: editorconfig-checker
          version: ${{ env.EDITORCONFIG_CHECKER_VERSION }}
          filename: ec-linux-amd64.tar.gz
          sha256: ${{ env.EDITORCONFIG_CHECKER_SHA256 }}
          origin: https://github.com
          directory: >-
            editorconfig-checker/editorconfig-checker/releases/download/v${{ env.EDITORCONFIG_CHECKER_VERSION }}

      - name: Install EditorConfig Checker
        run: |
          set -euo pipefail

          destination="${{ steps.editorconfig_download.outputs.path }}"
          extract_dir="${RUNNER_TEMP}/editorconfig-checker"
          binary="${extract_dir}/bin/ec-linux-amd64"

          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}"

          tar \
            --extract \
            --gzip \
            --file="${destination}" \
            --directory="${extract_dir}"

          if [[ ! -f "${binary}" ]]; then
            echo "EditorConfig Checker binary not found: ${binary}" >&2
            echo "Archive contents:" >&2
            tar \
              --list \
              --gzip \
              --file="${destination}" \
              >&2
            exit 1
          fi

          install \
            --mode=0755 \
            "${binary}" \
            "${RUNNER_TEMP}/ec"

      - name: Run EditorConfig Checker
        run: |
          set -euo pipefail

          "${RUNNER_TEMP}/ec"

  json:
    name: JSON and JSONC
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Biome binary
        id: biome_download
        uses: ./.github/actions/verified-download
        with:
          name: biome
          version: ${{ env.BIOME_VERSION }}
          filename: biome-linux-x64
          sha256: ${{ env.BIOME_SHA256 }}
          origin: https://github.com
          directory: >-
            biomejs/biome/releases/download/%40biomejs/biome%40${{ env.BIOME_VERSION }}

      - name: Install Biome
        run: |
          set -euo pipefail

          install \
            --mode=0755 \
            "${{ steps.biome_download.outputs.path }}" \
            "${RUNNER_TEMP}/biome"

      - name: Find and lint all JSON files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.json' '*.jsonc'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked JSON or JSONC files found."
            exit 0
          fi

          printf 'Linting %d JSON or JSONC file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/biome" \
            lint \
            --config-path tools/lint/code/json/biome-config.json \
            --error-on-warnings \
            --reporter github \
            "${files[@]}"

  yamllint:
    name: YAML
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/yamllint"

          "${RUNNER_TEMP}/yamllint/bin/python" \
            -m pip \
            install \
            --disable-pip-version-check \
            --no-input \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Find and lint all YAML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.yml' '*.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked YAML files found."
            exit 0
          fi

          printf 'Linting %d YAML file(s).\n' "${#files[@]}"

          "${RUNNER_TEMP}/yamllint/bin/yamllint" \
            --config-file tools/lint/code/yaml/yamllint.yml \
            --format github \
            "${files[@]}"

  taplo:
    name: TOML
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Taplo
        run: |
          set -euo pipefail

          cargo install \
            taplo-cli \
            --version "${TAPLO_VERSION}" \
            --locked

      - name: Find and validate all TOML files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked TOML files found."
            exit 0
          fi

          printf 'Linting %d TOML file(s).\n' "${#files[@]}"

          taplo \
            lint \
            --config tools/lint/code/taplo/taplo.toml \
            "${files[@]}"

      - name: Check TOML formatting
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.toml'
          )

          if (( ${#files[@]} == 0 )); then
            exit 0
          fi

          taplo \
            fmt \
            --config tools/lint/code/taplo/taplo.toml \
            --check \
            "${files[@]}"

  markdownlint:
    name: Markdown
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Find and lint all Markdown files
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.markdown'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No tracked Markdown files found."
            exit 0
          fi

          printf 'Linting %d Markdown file(s).\n' "${#files[@]}"

          args=()

          for file in "${files[@]}"; do
            args+=(":${file}")
          done

          npx \
            --yes \
            "markdownlint-cli2@${MARKDOWNLINT_VERSION}" \
            --config tools/lint/code/md/markdownlint-cli2.jsonc \
            "${args[@]}"


  c:
    name: C
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore clang-format wheel
        id: clang_format
        uses: ./.github/actions/verified-download
        with:
          name: clang-format
          version: ${{ env.CLANG_FORMAT_VERSION }}
          filename: >-
            clang_format-22.1.8-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          sha256: ${{ env.CLANG_FORMAT_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/e5/88/b82c066fa807da4ca2518fecf79071361f6324b77375e5e92c059c0697fd

      - name: Restore clang-tidy wheel
        id: clang_tidy
        uses: ./.github/actions/verified-download
        with:
          name: clang-tidy
          version: ${{ env.CLANG_TIDY_VERSION }}
          filename: >-
            clang_tidy-22.1.8-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          sha256: ${{ env.CLANG_TIDY_SHA256 }}
          origin: https://files.pythonhosted.org
          directory: packages/82/19/0f2668f8f5e2452b096a2b898f2b6bcecbceb6dd0c7f75d1755ce1f18d8b

      - name: Install pinned Clang tools
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/coil-clang"
          "${RUNNER_TEMP}/coil-clang/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            "${{ steps.clang_format.outputs.path }}" \
            "${{ steps.clang_tidy.outputs.path }}"

          "${RUNNER_TEMP}/coil-clang/bin/clang-format" --version
          "${RUNNER_TEMP}/coil-clang/bin/clang-tidy" --version

      - name: Validate C policy and sources
        run: |
          set -euo pipefail

          clang_format="${RUNNER_TEMP}/coil-clang/bin/clang-format"
          clang_tidy="${RUNNER_TEMP}/coil-clang/bin/clang-tidy"
          format_config="tools/lint/code/c/.clang-format"
          tidy_config="tools/lint/code/c/.clang-tidy"

          "${clang_format}" \
            --style="file:${format_config}" \
            --dump-config \
            >/dev/null

          "${clang_tidy}" \
            --experimental-custom-checks \
            --config-file="${tidy_config}" \
            --list-checks \
            >/dev/null

          mapfile -d '' format_files < <(
            git ls-files -z -- '*.c' '*.h' '*.i'
          )

          if (( ${#format_files[@]} == 0 )); then
            echo "No tracked C sources or headers found; policy files are valid."
            exit 0
          fi

          "${clang_format}" \
            --style="file:${format_config}" \
            --dry-run \
            --Werror \
            "${format_files[@]}"

          mapfile -d '' translation_units < <(
            git ls-files -z -- '*.c' '*.i'
          )

          for source in "${translation_units[@]}"; do
            "${clang_tidy}" \
              --experimental-custom-checks \
              --config-file="${tidy_config}" \
              "${source}" \
              -- \
              -std=c23 \
              -I.
          done


  bazel:
    name: Bazel
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure runner-near cache plane
        id: cache_plane
        uses: ./.github/actions/cache-plane

      - name: Test Bazel workspace when present
        env:
          COIL_BAZELRC: ${{ steps.cache_plane.outputs.bazelrc }}
        run: |
          set -euo pipefail

          workspace=false
          for marker in MODULE.bazel WORKSPACE.bazel WORKSPACE; do
            if [[ -f "${marker}" ]]; then
              workspace=true
              break
            fi
          done

          if [[ "${workspace}" != true ]]; then
            echo "No Bazel workspace found; cache integration is ready."
            exit 0
          fi

          if ! command -v bazel >/dev/null 2>&1; then
            printf '%s\n' \
              'Bazel workspace found, but bazel is not installed.' >&2
            exit 1
          fi

          bazel \
            --bazelrc="${COIL_BAZELRC}" \
            test \
            //...


  lua:
    name: Lua
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Lua sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              *.lua)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])lua([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Lua sources found; skipping Lua lint."
          fi

      - name: Restore Lua archive
        id: lua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: lua
          version: ${{ env.LUA_VERSION }}
          filename: lua-${{ env.LUA_VERSION }}.tar.gz
          sha256: ${{ env.LUA_SHA256 }}
          origin: https://www.lua.org
          directory: ftp

      - name: Restore Selene archive
        id: selene_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: selene
          version: ${{ env.SELENE_VERSION }}
          filename: selene-${{ env.SELENE_VERSION }}-linux.zip
          sha256: ${{ env.SELENE_SHA256 }}
          origin: https://github.com
          directory: Kampfkarren/selene/releases/download/${{ env.SELENE_VERSION }}

      - name: Restore StyLua archive
        id: stylua_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: stylua
          version: ${{ env.STYLUA_VERSION }}
          filename: stylua-linux-x86_64.zip
          sha256: ${{ env.STYLUA_SHA256 }}
          origin: https://github.com
          directory: JohnnyMorganz/StyLua/releases/download/v${{ env.STYLUA_VERSION }}

      - name: Restore LuaLS archive
        id: luals_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: lua-language-server
          version: ${{ env.LUALS_VERSION }}
          filename: >-
            lua-language-server-${{ env.LUALS_VERSION }}-linux-x64.tar.gz
          sha256: ${{ env.LUALS_SHA256 }}
          origin: https://github.com
          directory: >-
            LuaLS/lua-language-server/releases/download/${{ env.LUALS_VERSION }}

      - name: Install pinned Lua toolchain
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          lua_archive="${{ steps.lua_download.outputs.path }}"

          tar -xzf "${lua_archive}" -C "${RUNNER_TEMP}"
          make --directory="${RUNNER_TEMP}/lua-${LUA_VERSION}" \
            --jobs="$(nproc)" all

          selene_archive="${{ steps.selene_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/selene"
          unzip -q "${selene_archive}" -d "${RUNNER_TEMP}/selene"
          chmod 0755 "${RUNNER_TEMP}/selene/selene"

          stylua_archive="${{ steps.stylua_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/stylua"
          unzip -q "${stylua_archive}" -d "${RUNNER_TEMP}/stylua"
          chmod 0755 "${RUNNER_TEMP}/stylua/stylua"

          luals_archive="${{ steps.luals_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/luals"
          tar -xzf "${luals_archive}" -C "${RUNNER_TEMP}/luals"

      - name: Run Lua checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_lua_files() {
            while IFS= read -r -d '' file; do
              case "${file}" in
                *.lua)
                  printf '%s\0' "${file}"
                  continue
                  ;;
              esac

              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${first_line}" =~ ^#!.*(^|[[:space:]/])lua([[:space:]]|$) ]]; then
                printf '%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          mapfile -d '' files < <(collect_lua_files)

          printf 'Checking %d Lua source file(s).\n' "${#files[@]}"

          for file in "${files[@]}"; do
            "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/luac" -p "${file}"
          done

          "${RUNNER_TEMP}/lua-${LUA_VERSION}/src/lua" \
            tools/lint/spell/dictionary/generate.lua \
            --check

          "${RUNNER_TEMP}/selene/selene" \
            --config tools/lint/code/lua/selene.toml \
            "${files[@]}"

          "${RUNNER_TEMP}/stylua/stylua" \
            --check \
            --config-path tools/lint/code/lua/stylua.toml \
            "${files[@]}"

          "${RUNNER_TEMP}/luals/bin/lua-language-server" \
            --configpath=tools/lint/code/lua/luals.json \
            --check="${GITHUB_WORKSPACE}" \
            --checklevel=Warning

  python:
    name: Python
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Python sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              *.py|*.pyi)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*python([0-9.]*)?([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked Python sources found; skipping Python lint."
          fi

      - name: Setup Node.js for Pyright
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Restore Ruff archive
        id: ruff_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: ruff
          version: ${{ env.RUFF_VERSION }}
          filename: ruff-x86_64-unknown-linux-gnu.tar.gz
          sha256: ${{ env.RUFF_SHA256 }}
          origin: https://github.com
          directory: astral-sh/ruff/releases/download/${{ env.RUFF_VERSION }}

      - name: Restore Pyright archive
        id: pyright_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: pyright
          version: ${{ env.PYRIGHT_VERSION }}
          filename: pyright.tgz
          sha256: ${{ env.PYRIGHT_SHA256 }}
          origin: https://github.com
          directory: microsoft/pyright/releases/download/${{ env.PYRIGHT_VERSION }}

      - name: Install Python lint tools
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          ruff_archive="${{ steps.ruff_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/ruff"
          tar -xzf "${ruff_archive}" -C "${RUNNER_TEMP}/ruff" \
            --strip-components=1

          pyright_archive="${{ steps.pyright_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/pyright"
          tar -xzf "${pyright_archive}" \
            -C "${RUNNER_TEMP}/pyright" \
            --strip-components=1

          python3 -m venv "${RUNNER_TEMP}/bandit"

          "${RUNNER_TEMP}/bandit/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --no-input \
            "bandit==${BANDIT_VERSION}"

      - name: Run Python checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_python_files() {
            while IFS= read -r -d '' file; do
              case "${file}" in
                *.py|*.pyi)
                  printf '%s\0' "${file}"
                  continue
                  ;;
              esac

              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${first_line}" =~ ^#!.*python([0-9.]*)?([[:space:]]|$) ]]; then
                printf '%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          mapfile -d '' files < <(collect_python_files)
          mapfile -d '' py_files < <(
            printf '%s\0' "${files[@]}" \
              | while IFS= read -r -d '' file; do
                  [[ "${file}" == *.py ]] && printf '%s\0' "${file}"
                done
          )

          printf 'Checking %d Python source file(s).\n' "${#files[@]}"

          if (( ${#py_files[@]} > 0 )); then
            python3 -m compileall -q "${py_files[@]}"
          fi

          "${RUNNER_TEMP}/ruff/ruff" \
            check \
            --config tools/lint/code/python/ruff.toml \
            "${files[@]}"

          "${RUNNER_TEMP}/ruff/ruff" \
            format \
            --check \
            --config tools/lint/code/python/ruff.toml \
            "${files[@]}"

          node "${RUNNER_TEMP}/pyright/index.js" \
            --project tools/lint/code/python/pyrightconfig.json \
            "${files[@]}"

          if (( ${#py_files[@]} > 0 )); then
            "${RUNNER_TEMP}/bandit/bin/bandit" \
              --configfile tools/lint/code/python/bandit.yaml \
              "${py_files[@]}"
          fi

  shell:
    name: POSIX sh and Bash
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect shell sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            case "${file}" in
              *.sh|*.bash)
                found=true
                break
                ;;
            esac

            if [[ "${first_line}" =~ ^#!.*(bash|/sh|env[[:space:]]+sh)([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked POSIX sh or Bash sources found; skipping shell lint."
          fi

      - name: Restore ShellCheck archive
        id: shellcheck_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: shellcheck
          version: ${{ env.SHELLCHECK_VERSION }}
          filename: >-
            shellcheck-v${{ env.SHELLCHECK_VERSION }}.linux.x86_64.tar.xz
          sha256: ${{ env.SHELLCHECK_SHA256 }}
          origin: https://github.com
          directory: >-
            koalaman/shellcheck/releases/download/v${{ env.SHELLCHECK_VERSION }}

      - name: Restore shfmt binary
        id: shfmt_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: shfmt
          version: ${{ env.SHFMT_VERSION }}
          filename: shfmt_v${{ env.SHFMT_VERSION }}_linux_amd64
          sha256: ${{ env.SHFMT_SHA256 }}
          origin: https://github.com
          directory: mvdan/sh/releases/download/v${{ env.SHFMT_VERSION }}

      - name: Install ShellCheck and shfmt
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          shellcheck_archive="${{ steps.shellcheck_download.outputs.path }}"

          tar -xJf "${shellcheck_archive}" -C "${RUNNER_TEMP}"

          install --mode=0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/shellcheck"

          shfmt_binary="${RUNNER_TEMP}/shfmt"
          install \
            --mode=0755 \
            "${{ steps.shfmt_download.outputs.path }}" \
            "${shfmt_binary}"

      - name: Run POSIX sh and Bash checks
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_shell_files() {
            while IFS= read -r -d '' file; do
              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${file}" == *.bash || "${first_line}" =~ bash ]]; then
                printf 'bash\t%s\0' "${file}"
              elif [[ "${file}" == *.sh || "${first_line}" =~ ^#!.*(/sh|env[[:space:]]+sh)([[:space:]]|$) ]]; then
                printf 'posix\t%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          posix_files=()
          bash_files=()

          while IFS= read -r -d '' record; do
            dialect="${record%%$'\t'*}"
            file="${record#*$'\t'}"

            if [[ "${dialect}" == bash ]]; then
              bash_files+=("${file}")
            else
              posix_files+=("${file}")
            fi
          done < <(collect_shell_files)

          if (( ${#posix_files[@]} > 0 )); then
            printf 'Checking %d POSIX sh file(s).\n' "${#posix_files[@]}"

            "${RUNNER_TEMP}/shellcheck" \
              --shell=sh \
              --rcfile=tools/lint/code/shell/posix/shellcheckrc \
              "${posix_files[@]}"

            "${RUNNER_TEMP}/shfmt" \
              -d \
              -ln posix \
              "${posix_files[@]}"
          fi

          if (( ${#bash_files[@]} > 0 )); then
            printf 'Checking %d Bash file(s).\n' "${#bash_files[@]}"

            "${RUNNER_TEMP}/shellcheck" \
              --shell=bash \
              --rcfile=tools/lint/code/shell/bash/shellcheckrc \
              "${bash_files[@]}"

            "${RUNNER_TEMP}/shfmt" \
              -d \
              -ln bash \
              "${bash_files[@]}"

            if command -v bash >/dev/null 2>&1; then
              for file in "${bash_files[@]}"; do
                bash -n "${file}"
              done
            else
              echo "Bash is unavailable; bash -n parser check skipped."
            fi
          fi

  powershell:
    name: PowerShell 7
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        'ubuntu-24.04' ||
        vars.COIL_CI_RUNNER ||
        'ubuntu-24.04'
      }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect PowerShell sources
        id: detect
        run: |
          set -euo pipefail

          found=false

          while IFS= read -r -d '' file; do
            case "${file}" in
              tools/lint/code/shell/powershell/*)
                continue
                ;;
              *.ps1|*.psm1|*.psd1)
                found=true
                break
                ;;
            esac

            first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

            if [[ "${first_line}" =~ ^#!.*pwsh([[:space:]]|$) ]]; then
              found=true
              break
            fi
          done < <(git ls-files -z)

          echo "found=${found}" >> "${GITHUB_OUTPUT}"

          if [[ "${found}" == false ]]; then
            echo "No tracked PowerShell sources found; skipping PowerShell lint."
          fi

      - name: Restore PowerShell archive
        id: powershell_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: powershell
          version: ${{ env.POWERSHELL_VERSION }}
          filename: powershell-${{ env.POWERSHELL_VERSION }}-linux-x64.tar.gz
          sha256: ${{ env.POWERSHELL_SHA256 }}
          origin: https://github.com
          directory: PowerShell/PowerShell/releases/download/v${{ env.POWERSHELL_VERSION }}

      - name: Restore PSScriptAnalyzer package
        id: psscriptanalyzer_download
        if: steps.detect.outputs.found == 'true'
        uses: ./.github/actions/verified-download
        with:
          name: psscriptanalyzer
          version: ${{ env.PSSCRIPTANALYZER_VERSION }}
          filename: >-
            PSScriptAnalyzer.${{ env.PSSCRIPTANALYZER_VERSION }}.nupkg
          sha256: ${{ env.PSSCRIPTANALYZER_SHA256 }}
          origin: https://github.com
          directory: >-
            PowerShell/PSScriptAnalyzer/releases/download/${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Install pinned PowerShell and PSScriptAnalyzer
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          pwsh_archive="${{ steps.powershell_download.outputs.path }}"

          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${pwsh_archive}" -C "${RUNNER_TEMP}/powershell"
          chmod 0755 "${RUNNER_TEMP}/powershell/pwsh"

          analyzer_package="${{ steps.psscriptanalyzer_download.outputs.path }}"

          module_root="${RUNNER_TEMP}/modules/PSScriptAnalyzer"
          module_dir="${module_root}/${PSSCRIPTANALYZER_VERSION}"
          mkdir -p "${module_dir}"
          unzip -q "${analyzer_package}" -d "${module_dir}"

      - name: Run PowerShell parser and PSScriptAnalyzer
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail

          collect_powershell_files() {
            while IFS= read -r -d '' file; do
              case "${file}" in
                tools/lint/code/shell/powershell/*)
                  continue
                  ;;
                *.ps1|*.psm1|*.psd1)
                  printf '%s\0' "${file}"
                  continue
                  ;;
              esac

              first_line="$(head -n 1 -- "${file}" 2>/dev/null || true)"

              if [[ "${first_line}" =~ ^#!.*pwsh([[:space:]]|$) ]]; then
                printf '%s\0' "${file}"
              fi
            done < <(git ls-files -z)
          }

          mapfile -d '' files < <(collect_powershell_files)
          pwsh="${RUNNER_TEMP}/powershell/pwsh"
          module="${RUNNER_TEMP}/modules/PSScriptAnalyzer/${PSSCRIPTANALYZER_VERSION}/PSScriptAnalyzer.psd1"
          settings="${GITHUB_WORKSPACE}/tools/lint/code/shell/powershell/PSScriptAnalyzerSettings.psd1"

          printf 'Checking %d PowerShell source file(s).\n' "${#files[@]}"

          for file in "${files[@]}"; do
            # PowerShell expands variables inside this single-quoted payload.
            # shellcheck disable=SC2016
            "${pwsh}" -NoLogo -NoProfile -NonInteractive -Command '
              param([string] $Path)
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path -LiteralPath $Path),
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null
              if ($errors.Count -ne 0) {
                  $errors | ForEach-Object {
                      Write-Error $_.Message
                  }
                  exit 1
              }
            ' "${file}"
          done

          # PowerShell expands variables inside this single-quoted payload.
          # shellcheck disable=SC2016
          "${pwsh}" -NoLogo -NoProfile -NonInteractive -Command '
            param(
                [string] $Module,
                [string] $Settings,
                [Parameter(ValueFromRemainingArguments = $true)]
                [string[]] $Paths
            )
            Import-Module -Name $Module -Force
            $results = foreach ($path in $Paths) {
                Invoke-ScriptAnalyzer -Path $path -Settings $Settings
            }
            if ($results) {
                $results | Format-Table -AutoSize | Out-String | Write-Host
                exit 1
            }
          ' "${module}" "${settings}" "${files[@]}"

